[prep]
backend = "groq"
model = "openai/gpt-oss-20b"
fallback_backend = "gemini"
fallback_model = "gemini-3.5-flash-lite"
unwrap = true
max_edit_ratio = 0.02

[artifacts]
image_format = "jxl"
audio_format = "opus"
opus_bitrate = 32

[scroll]
overlay = true
overlay_color = "#f6c177"
overlay_width = 4
