context.modules = [
    {
        name = libpipewire-module-loopback
        args = {
            node.description = "Firefox Audio"
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "firefox-sink"
                media.class      = "Audio/Sink"
                node.description = "Firefox Audio"
                # Make it appear as a real device in pulsemixer
                device.description = "Firefox Audio"
                device.class       = "sound"
                device.icon-name   = "audio-card"
                node.virtual       = false
            }
            playback.props = {
                node.name      = "firefox-sink-output"
                node.passive   = true
                # Leave target.object empty to use default output
                # Or specify: target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo"
            }
        }
    }
]
