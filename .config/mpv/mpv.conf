#osc=no
#osd-bar=no

# hwdec=nvdec
hwdec=nvdec-copy

cache=auto
demuxer-max-back-bytes=5GiB
demuxer-max-bytes=7GiB
watch-later-directory=~/.local/share/mpv/watch_later

# audio-device='alsa/front:CARD=Pro,DEV=0'
# audio-exclusive=yes
# demuxer-rawaudio-format=u32be

