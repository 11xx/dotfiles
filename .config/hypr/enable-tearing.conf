general {
    allow_tearing = true
}

env = WLR_DRM_NO_ATOMIC,1

windowrule = immediate on, match:class ^eldenring.exe$
windowrule = immediate on, match:class ^gamescope$
windowrule = immediate on, match:class ^steam_app_[0-9]+$
windowrule = immediate on, match:class ^mpv$
windowrule = immediate on, match:class love, match:title Freesync test
