$neron-bg = rgb(222222)
$neron-green = rgb(61bd09)
$neron-pink = rgb(ff77cf)
$neron-cyan = rgb(16b0cf)
$neron-fg = rgb(a6a8a9)
$neron-current = rgb(2f2f2f)
$current-icon = rgb(666666)

plugin {
    hyprbars {
        bar_height = 20
        bar_color = $neron-bg
        col.text = $neron-fg
        bar_text_size = 9
        # bar_text_font = Jetbrains Mono Nerd Font Mono Bold
        bar_text_font = LiterationMono Nerd Font Bold
        bar_button_padding = 10
        bar_padding = 5
        bar_precedence_over_border = true
        hyprbars-button = $neron-pink, 16, , hyprctl dispatch killactive
        hyprbars-button = $neron-green, 16, , hyprctl dispatch fullscreen 2
        hyprbars-button = $neron-cyan, 16, , hyprctl dispatch togglefloating
   }
}

windowrulev2 = plugin:hyprbars:nobar, ^floating:0
