plugin {
  hyprbars {
    bar_height = 20
    bar_color = $bg-secondary
    col.text = $fg-color
    bar_text_size = 9
    bar_text_font = Noto Sans
    bar_button_padding = 10
    bar_padding = 5
    bar_precedence_over_border = true
    hyprbars-button = $hyprbars-close-color, 16, , hyprctl dispatch killactive
    hyprbars-button = $hyprbars-maximize-color, 16, , hyprctl dispatch fullscreen 2
    hyprbars-button = $hyprbars-float-color, 16, , hyprctl dispatch togglefloating
  }
}

windowrule = hyprbars:no_bar true, match:float false
