# Polkit dialogs
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float on

# Picture-in-Picture (dynamic title, requires full regex match)
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on

# Emacs floating frames
windowrule = match:title ^(Edit with Emacs FRAME)$, float on

# Wine/Proton windows
windowrule = match:class ^.*(floatWMRULE|FLOAT_WMRULE)$, float on
windowrule = match:title ^.*(floatWMRULE|FLOAT_WMRULE)$, float on

# File open dialogs (anchor pattern at start, not middle)
windowrule = match:title ^Open File, float on
windowrule = match:title ^Vivaldi Settings:, float on

# MPV suppress maximize (prevents maximization requests)
windowrule = match:class ^mpv$, suppress_event maximize

# Floating .exe windows (Windows app shortcuts)
windowrule = match:class .*\.exe$, float on

# Emacs
windowrule = match:class emacs, match:title Ediff, float on
windowrule = match:class emacs, match:title Ediff, size 720 330
windowrule = match:class emacs, match:title Ediff, move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5))

# Blender
windowrule = match:title ^Blender (Render|Preferences)$, float on

# Steam & Games
windowrule = match:title ^Create or select new Steam library folder$, float on
windowrule = match:class steam, match:title Friends List, float on
windowrule = match:class steam, match:title Steam Settings, float on
# windowrule = match:class steam, float on  # Uncomment to float all Steam windows
# Steam apps: send to workspace 6, render in background for FPS stability
windowrule = match:class ^(steam_app_[0-9]+)$, monitor 0 silent
windowrule = match:class ^(steam_app_[0-9]+)$, workspace 6 silent

# Elden Ring: prevent FPS drops when unfocused
windowrule = match:class steam_app_2622380, match:title ELDEN RING NIGHTREIGN, render_unfocused on

# Render unfocused at lower FPS (add to config misc section)
# misc {
#   render_unfocused_fps = 30
# }

# File Managers
windowrule = match:class org.kde.ark, match:title ^(File Already Exists).*Ark$, float on
windowrule = match:class org.kde.dolphin, match:title ^(Choose Application).*Dolphin$, float on
windowrule = match:class org.freedesktop.impl.portal.desktop.kde, float on

# Firefox
# Empty title notifications (popups with no text)
windowrule = match:class firefox, match:title ^$, float on
windowrule = match:class firefox, match:title Library, float on

# Global rule: disable blur for windows with empty class/title (xwayland context menus)
windowrule = match:class ^()$, match:title ^()$, no_blur on

# Inkscape
windowrule = match:class org.inkscape.Inkscape, match:title ^(SVG Input)$, float on
