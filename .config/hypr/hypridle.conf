# =hypridle.conf=: Idle management daemon
# :PROPERTIES:
# :header-args:hyprlang-ts: :tangle hypridle.conf :comments org
# :END:
# - [[https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/][hypridle – Hyprland Wiki]]

# Hypridle still uses hyprlang. It is not part of Hyprland's Lua config migration,
# so it should continue to tangle to =hypridle.conf= and be launched by
# =exec_once("hypridle")=.

# - Monitor DPMS and brightness for hypridle ::

listener {
  timeout = 330                                                                                  # 5.5min
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'                            # screen off when timeout has passed
  on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}
