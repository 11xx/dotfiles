source=./monitors.conf # generated by nwg-displays

workspace = 1, monitor:desc:Dell Inc. DELL S2721DGF FZ6B4H3, default:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, monitor:desc:Dell Inc. DELL P2418D 29J0P96K06MT, default:true
workspace = 5, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true
workspace = 9, persistent:true, gapsin:0, gapsout:0, border:true, rounding:false
workspace = 10, persistent:true

workspace = w[t1], gapsin:0, gapsout:0, border:1
workspace = w[tg1], gapsin:0, gapsout:0, border:1
workspace = f[1], gapsin:0, gapsout:0, border:1

exec-once = /usr/lib/polkit-kde-authentication-agent-1

exec-once = lightordark-wallpaper # script
exec-once = kdeconnectd # KDE connect daemon
exec-once = sh -c 'sleep 2 && eww open mainbar && eww open mainbar2'
exec-once = hypr-eww-restart-on-monitor-change

exec-once = xsettingsd # GTK2-3 theme live changes
exec-once = sh -c 'emacs --daemon && sleep 1 && emacs-launcher'

# exec-once = gammastep -P
exec-once = hypridle

exec-once = XDG_MENU_PREFIX=arch- kbuildsycoca6

env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Firefox
env = EGL_PLATFORM,wayland # unset this when on X11
env = MOZ_ENABLE_WAYLAND,1 # necessary otherwise Firefox will only try X11

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland,x11
env = CLUTTER_BACKEND,wayland

input {
    kb_layout = us,br
    numlock_by_default = true
    follow_mouse = 1
    # Follow Mouse
    # 0 - disabled
    # 1 - full
    # 2 - loose. Will focus mouse on other windows on focus but not the keyboard.
    # 3 - full loose, will not refocus on click, but allow mouse focus to be
      # detached from the keyboard like in 2.

    float_switch_override_focus = 0
    # See https://wiki.hyprland.org/Configuring/Variables/#:~:text=float_switch_override_focus

    sensitivity = -0.6 # -1.0 - 1.0, 0 means no modification.

    accel_profile = flat
    # force_no_accel = true # not recommended in the wiki

    # keyboard key repeat
    repeat_rate = 80 # char/sec i think
    repeat_delay = 200
}

general {
    layout = dwindle

    resize_on_border = true
    extend_border_grab_area = 20
    # no_cursor_warps = true # don't move the cursor with keybinds
    resize_corner = 3 # bottom right
}

xwayland {
    use_nearest_neighbor = false # necessary when not forcing scaling to make it look ok/blurry
    force_zero_scaling = false # makes xwayland sharp when not using
                              # GDK_SCALE, if using scaling is
                              # overriden, but still sharp.
                              # [2023-06-14 Wed 08:24:55 -03]
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true
    preserve_split = true
    force_split = 2 # 0 -> split follows mouse, 1 -> always split to the left (new = left or top) 2 -> always split to the right (new = right or bottom)
    # use_active_for_splits = true
}

misc {
     disable_hyprland_logo = true
     # testing, it is recommended to set to true
     # vfr=false # why energy save on this for desktop :)

     animate_manual_resizes = true
     mouse_move_focuses_monitor = true
     animate_mouse_windowdragging = false
     enable_swallow = false
     swallow_regex = ^(Alacritty)$
     # swallow_exception_regex = ^(.*Microsoft Edge.*|Mozilla Firefox|.*Chromium|.*Brave.*|wev)$

     mouse_move_enables_dpms = true #prevents accidental wake up
     key_press_enables_dpms = true
}

binds {
      allow_workspace_cycles = true
      workspace_center_on = 1
      movefocus_cycles_fullscreen = false
}

source = window-rules.conf

windowrule = suppress_event maximize, match:class .*

source = layer-surface-rules.conf

source = keybinds.conf

# file containing nested sourcing for color definitions, useful for
# editing/automating changes from scripts like darkman.
source = themes/theme.conf # (ref:hyprland-conf-theming-sourcing)
source = shadows.conf
source = animations.conf
source = blur.conf
source = mouse.conf

source = nvidia.conf

source = vrr.conf

# source = plugins/hyprbars.conf

source = enable-tearing.conf

source = idleinhibit.conf
