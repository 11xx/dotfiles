source=./monitors.conf # generated by nwg-displays

workspace = 1, monitor:desc:Dell Inc. DELL S2721DGF FZ6B4H3, default:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, monitor:desc:Dell Inc. DELL P2418D 29J0P96K06MT, default:true
workspace = 5, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true
workspace = 9, persistent:true
workspace = 10, persistent:true

# ## Execute your favorite apps at launch
# exec-once = dunst

# http://wiki.hyprland.org/Useful-Utilities/Must-have/#authentication-agent
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# swaybg --color '##382738' # wallpaper
exec-once = lightordark-wallpaper
exec-once = /usr/lib/kdeconnectd # KDE connect
exec-once = eww open mainbar & eww open mainbar2
exec-once = xsettingsd
# exec-once = kmonad-launch # script
# exec-once = mpd-local # script
exec-once = emacs --daemon && sleep 1 && emacs-launcher # script

# Cursor
$cursorTheme = Breeze # directory name of the cursor theme
# set cursor theme [[https://wiki.hyprland.org/FAQ/#how-do-i-change-me-mouse-cursor][Faq | Hyprland Wiki]]
exec-once = hyprctl setcursor '$cursorTheme' 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme '$cursorTheme'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 20


exec-once = gammastep -P

# Some default env vars.
env = XCURSOR_SIZE,24

# #TODO-review utility of these
# Nvidia support
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
# env = GBM_BACKEND,nvidia-drm # can cause issues? [[https://github.com/hyprwm/Hyprland/issues/2369#issuecomment-1564994687][Stuttering frames · Issue #2369 · hyprwm/Hyprland]]
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,0

env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Firefox
env = EGL_PLATFORM,wayland # unset this when on X11
env = MOZ_ENABLE_WAYLAND,1 # necessary otherwise Firefox will only try X11

# GTK
# env = GDK_SCALE,2

# redundant with shell profile, setting here just as a reminder.
# AUR package 'qgnomeplatform-{common,qt5,qt6}-git'
env = QT_QPA_PLATFORMTHEME,gnome

# xwayland scale
# exec-once=xprop -root -f _XWAYLAND_GLOBAL_OUTPUT_SCALE 32c -set _XWAYLAND_GLOBAL_OUTPUT_SCALE 2

input {
    kb_layout = us,br
    numlock_by_default = true
    follow_mouse = 2
    # Follow Mouse
    # 0 - disabled
    # 1 - full
    # 2 - loose. Will focus mouse on other windows on focus but not the keyboard.
    # 3 - full loose, will not refocus on click, but allow mouse focus to be
      # detached from the keyboard like in 2.

    # float_switch_override_focus = 0

    sensitivity = -0.6 # -1.0 - 1.0, 0 means no modification.

    accel_profile = flat
    # force_no_accel = true # not recommended in the wiki

    # keyboard key repeat
    repeat_rate = 80 # char/sec i think
    repeat_delay = 200
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # (ref:hyprland-border-colors-import)

    layout = dwindle

    resize_on_border = true
    # no_cursor_warps = true # don't move the cursor with keybinds
    cursor_inactive_timeout = 0
    border_size = 2
}

xwayland {
    use_nearest_neighbor = false # necessary when not forcing scaling to make it look ok/blurry
    force_zero_scaling = false # makes xwayland sharp when not using
                              # GDK_SCALE, if using scaling is
                              # overriden, but still sharp.
                              # [2023-06-14 Wed 08:24:55 -03]
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 4 # def 10

    blur {
         enabled = true
         size = 5
         passes = 3
         new_optimizations = true
    }
}

source = ./shadows.conf

animations {
    enabled = false

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    # bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = myBezier, 0, 0, .58, 1

    animation = windows, 1, 1, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 4, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
    force_split = 2 # 0 -> split follows mouse, 1 -> always split to the left (new = left or top) 2 -> always split to the right (new = right or bottom)
    no_gaps_when_only = 0
    # use_active_for_splits = true
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_is_master = true
}

# gestures {
#     # See https://wiki.hyprland.org/Configuring/Variables/ for more
#     workspace_swipe = false
# }

misc {
     disable_hyprland_logo = true
     # testing, it is recommended to set to true
     vfr=false # why energy save on this for desktop :)
     # Enable variable refresh rate
     vrr=2 # 0 - off, 1 - on, 2 - fullscreen only

     animate_manual_resizes = false
     # mouse_move_focuses_monitor = true
     animate_mouse_windowdragging = false
     enable_swallow = false
     swallow_regex = ^(Alacritty)$
     # swallow_exception_regex = ^(.*Microsoft Edge.*|Mozilla Firefox|.*Chromium|.*Brave.*|wev)$

     mouse_move_enables_dpms = true #prevents accidental wake up
     key_press_enables_dpms = false
}

debug {
      overlay = false
}

# See https://wiki.hyprland.org/Configuring/Window-Rules/
windowrulev2 = float,class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float,title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = float,title:^(Edit with Emacs FRAME)$
windowrulev2 = float,class:^.*(floatWMRULE|FLOAT_WMRULE)$
windowrulev2 = float,title:^.*(floatWMRULE|FLOAT_WMRULE)$
# windowrulev2 = opacity 0.94 0.94,class:^(Dunst)$
windowrulev2 = float,title:^Open File(|s)
windowrulev2 = float,title:^Vivaldi Settings:
windowrulev2 = suppressevent maximize, class:^mpv$
windowrulev2 = float,class:(emacs),title:(Ediff)
# windowrulev2 = size 720 480,class:(emacs),title:(Ediff)
windowrulev2 = size 100 100,class:(emacs),title:(Ediff)
# windowrulev2 = center 1,class:(emacs),title:(Ediff)
windowrulev2 = move cursor -50% -50%,class:(emacs),title:(Ediff)
windowrulev2 = float,class:(firefox),title:^(Extension:.*)$ # doesnt work apprntly

# Blender
windowrulev2 = float,title:^Blender (Render|Preferences)$

# Steam
windowrulev2 = float,title:^Create or select new Steam library folder$

# Blur notifications and bars, [[https://wiki.hyprland.org/Configuring/Keywords/#blurring-layersurfaces][Keywords | Hyprland Wiki]]
# [[https://www.reddit.com/r/hyprland/comments/10q5t3e/comment/j6ok1qm/?context=3][No blur on hyprland? : hyprland]]
blurls = notifications
blurls = wob
blurls = launcher

# #### Binds ####
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER
$browser = firefox-launcher

bind = $mainMod, V, togglefloating,
bind = $mainMod, R, togglesplit, # dwindle

# [[https://github.com/hyprwm/Hyprland/issues/102][Submap of key bindings · Issue #102 · hyprwm/Hyprland]]
# [[https://wiki.hyprland.org/Configuring/Uncommon-tips--tricks/#disabling-keybinds-with-one-master-keybind][Uncommon Tips & Tricks | Hyprland Wiki]]
# custom
# $reset = && hyprctl dispatch submap reset
# usage: $reset at the end of `exec' keybinds
# alternative for non-exec: declare the same keybind again with the `submap, reset' after the first two fields for the keybind.
# remember to set a safety reset keybind e.g.: bind = $mainMod, G, submap, reset

bind = $mainMod, X, submap, exemap
submap = exemap
# bind = , space, exec, dmenu-def run $reset # dmenu script with custom command line options
# escape # with ##
# bind = , space, exec, bemenu-run --fn 'Liberation Mono' --nf '##f0f0f0' --sb '##76ee00' --sf '##111111' -i
bind = , space, exec, $(tofi-run)
bind = , space, submap, reset
bind = , C, killactive, # for kill with M-x c
bind = , C, submap, reset
bind = $mainMod, C, killactive, # for kill with M-x M-c
bind = $mainMod, C, submap, reset
bind = , E, exec, emacs-launcher
bind = , B, exec, $browser
bind = , V, exec, vivaldi
# bind = , N, exec, [workspace special:emacs-quick-note;noanim] emacs-launcher -- -c -e '(bookmark-jump "chronological-random-notes")'
# bind = , N, exec, emacs-launcher -- -c -e '(bookmark-jump "chronological-random-notes")'

bind = $mainMod, G, submap, reset
source=./reset-submap.conf
submap = reset

bind = $mainMod ALT, C, killactive, # for kill with s-M-c

bind = $mainMod, return, exec, alacritty
bind = $mainMod, backspace, exec, foot

# custom
# move focus with mouse to the corner
# bind = $mainMod, J, cyclenext,
# bind = $mainMod, K, cyclenext, prev
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
# bind = $mainMod, H, exec, hyprctl --batch 'dispatch movefocus l; dispatch movecursortocorner 1'
# bind = $mainMod, L, exec, hyprctl --batch 'dispatch movefocus r; dispatch movecursortocorner 1'
# bind = $mainMod, K, exec, hyprctl --batch 'dispatch movefocus u; dispatch movecursortocorner 1'
# bind = $mainMod, J, exec, hyprctl --batch 'dispatch movefocus d; dispatch movecursortocorner 1'

bind = $mainMod, S, togglesplit,

# vim
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
# emacs
# USING scratchpads see
# bind = $mainMod SHIFT, B, movewindow, l
# bind = $mainMod SHIFT, N, movewindow, d
# bind = $mainMod SHIFT, P, movewindow, u
# bind = $mainMod SHIFT, F, movewindow, r

binde = $mainMod ALT, B, resizeactive, -10 0
binde = $mainMod ALT, N, resizeactive, 0 10
binde = $mainMod ALT, P, resizeactive, 0 -10
binde = $mainMod ALT, F, resizeactive, 10 0

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, hypr-workspace 1
bind = $mainMod, 2, exec, hypr-workspace 2
bind = $mainMod, 3, exec, hypr-workspace 3
bind = $mainMod, 4, exec, hypr-workspace 4
bind = $mainMod, 5, exec, hypr-workspace 5
bind = $mainMod, 6, exec, hypr-workspace 6
bind = $mainMod, 7, exec, hypr-workspace 7
bind = $mainMod, 8, exec, hypr-workspace 8
bind = $mainMod, 9, exec, hypr-workspace 9
bind = $mainMod, 0, exec, hypr-workspace 10

bind = $mainMod ALT, 1, workspace, 1
bind = $mainMod ALT, 2, workspace, 2
bind = $mainMod ALT, 3, workspace, 3
bind = $mainMod ALT, 4, workspace, 4
bind = $mainMod ALT, 5, workspace, 5
bind = $mainMod ALT, 6, workspace, 6
bind = $mainMod ALT, 7, workspace, 7
bind = $mainMod ALT, 8, workspace, 8
bind = $mainMod ALT, 9, workspace, 9
bind = $mainMod ALT, 0, workspace, 10

bind = $mainMod ALT, S, swapactiveworkspaces, 0 1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
$moveToWorkspace = movetoworkspacesilent # default is movetoworkspace
bind = $mainMod SHIFT, 1, $moveToWorkspace, 1
bind = $mainMod SHIFT, 2, $moveToWorkspace, 2
bind = $mainMod SHIFT, 3, $moveToWorkspace, 3
bind = $mainMod SHIFT, 4, $moveToWorkspace, 4
bind = $mainMod SHIFT, 5, $moveToWorkspace, 5
bind = $mainMod SHIFT, 6, $moveToWorkspace, 6
bind = $mainMod SHIFT, 7, $moveToWorkspace, 7
bind = $mainMod SHIFT, 8, $moveToWorkspace, 8
bind = $mainMod SHIFT, 9, $moveToWorkspace, 9
bind = $mainMod SHIFT, 0, $moveToWorkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ytdotool debounce script for faulty middle click
# bind = , mouse:274, exec, ydotool click -D 200 0xC2 --repeat=1
# middle-click-debouce

bind = $mainMod CTRL, P, pin,

# ## Layout binds
bind = $mainMod, F, submap, wm
submap = wm
bind = $mainMod, F, fullscreen, 1
# bind = , F, togglefloating,

# bind = $mainMod, G, submap, reset # fallback
source=./reset-submap.conf
submap = reset

bind = $mainMod, F11, fullscreen, 0


# Media keys
# the recommended in http://wiki.hyprland.org/Configuring/Binds/#uncommon-syms--binding-with-a-keycode
# is to use lower case for keysyms, it it stops working capitalized y'know
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioStop, exec, playerctl stop
# MPD
bind = $mainMod, XF86AudioNext, exec, playerctl --player=mpd next
bind = $mainMod, XF86AudioPrev, exec, playerctl --player=mpd previous
bind = $mainMod, XF86AudioPlay, exec, playerctl --player=mpd play-pause
bind = $mainMod, XF86AudioStop, exec, playerctl --player=mpd stop

# # MPD 2nd instance (deprecated)
# bind = $mainMod ALT, XF86AudioNext, exec, playerctl --player=mpd-local next
# bind = $mainMod ALT, XF86AudioPrev, exec, playerctl --player=mpd-local previous
# bind = $mainMod ALT, XF86AudioPlay, exec, playerctl --player=mpd-local play-pause
# bind = $mainMod ALT, XF86AudioStop, exec, playerctl --player=mpd-local stop

exec-once = wob-volume # script
binde = , XF86AudioLowerVolume, exec, change-volume --wob --change-volume -5
binde = , XF86AudioRaiseVolume, exec, change-volume --wob --change-volume +5

# [[https://github.com/xkbcommon/libxkbcommon/blob/master/include/xkbcommon/xkbcommon-keysyms.h][libxkbcommon/xkbcommon-keysyms.h at master · xkbcommon/libxkbcommon]]
bind = , print, exec, mkdir -p "$(xdg-user-dir PICTURES)/screenshots/" && grim -l 0 -t png "$(xdg-user-dir PICTURES)/screenshots/$(date +'%Y%m%d-%H%M%S-screenshot.png')" && notify-send -a Screenshot 'Fullscreen Screenshot taken'

# Hang when using default exit:
# FIX wizard https://github.com/hyprwm/Hyprland/issues/3558#issuecomment-1848768654
bind = $mainMod CTRL ALT, pause, exec, hyprctl dispatch exit 0; sleep 2; pgrep -x Hyprland >/dev/null && killall -9 Hyprland

# bind = $mainMod, O, focusmonitor, +1
bind = $mainMod, O, focusmonitor, +1
# bind = $mainMod, O, exec, hyprctl --batch 'dispatch focusmonitor +1; dispatch movecursortocorner 1'
bind = $mainMod SHIFT, O, movewindow, mon:+1
# exec, hyprctl dispatch movewindow mon:"$(hyprctl monitors -j | jq -r '.[] | select(.focused == false).id')"

# Notification contols
bind = $mainMod CTRL ALT, N, exec, dunstctl history-pop

# Reload second monitor to set the primary monitor:
bind = $mainMod CTRL ALT, D, exec, wlr-randr --output DP-2 --off && sleep 1 && wlr-randr --output DP-2 --on --pos 2048,122

# Switch keyboard layouts, find names with `hyprctl devices'
bind = , control_r, exec, hyprctl switchxkblayout "$(pgrep kmonad && printf 'kmonad-uinput-sink' || printf 'sino-wealth-usb-keyboard')" next
# If using KMonad it will create a virtual keyboard device with the
# same name as defined in (uinput-sink ...) but with all lowercase an
# spaces replaces with hyphens, e.g.:
# `output (uinput-sink "KMonad uinput Sink"...)' will become kmonad-uinput-sink

# pgrep kmonad > /dev/null && printf '%s\n' 'kmonad-uinput-sink' || printf 'sino-wealth-usb-keyboard\n'
# if pgrep kmonad > /dev/null; then printf '%s\n' 'kmonad-uinput-sink'; else printf 'sino-wealth-usb-keyboard\n'; fi

bind = $mainMod CTRL ALT, period, exec, tofimoji

bind = $mainMod, M, exec, terminal -w 120 -h 20 --float pulsemixer

# bind = $mainMod SHIFT, N, movetoworkspace, special:emacs-quick-note
# bind = $mainMod, N, workspace, special:emacs-quick-note

# file containing nested sourcing for color definitions, useful for
# editing/automating changes from scripts like darkman.
source = themes/theme.conf
