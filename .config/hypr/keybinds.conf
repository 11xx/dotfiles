# #### Binds ####
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$browser = firefox

bindu = SUPER, G, submap, reset

bind = SUPER, T, togglefloating,
bind = SUPER, R, layoutmsg, togglesplit
bind = SUPER, S, layoutmsg, swapsplit

# [[https://github.com/hyprwm/Hyprland/issues/102][Submap of key bindings · Issue #102 · hyprwm/Hyprland]]
# [[https://wiki.hyprland.org/Configuring/Uncommon-tips--tricks/#disabling-keybinds-with-one-master-keybind][Uncommon Tips & Tricks | Hyprland Wiki]]
# custom
# $reset = && hyprctl dispatch submap reset
# usage: $reset at the end of `exec' keybinds
# alternative for non-exec: declare the same keybind again with the `submap, reset' after the first two fields for the keybind.
# remember to set a safety reset keybind e.g.: bind = SUPER, G, submap, reset

# [[https://www.reddit.com/r/hyprland/comments/12q4xib/comment/jgqd0gw/][Activating lock/dpms from script with swayidle : r/hyprland]]
bindl = SUPER ALT, pause, exec, hyprctl dispatch dpms off

bind = SUPER, X, submap, exemap
  submap = exemap

  bind = , space, exec, $(tofi-run)
  bind = , space, submap, reset

  bind = , D, exec, dolphin
  bind = , D, submap, reset

  bind = SUPER, C, killactive, # for kill with M-x M-c
  bind = SUPER, C, submap, reset

  bind = , F, exec, firefox
  bind = , F, submap, reset

  bind = , Z, exec, zen-browser
  bind = , Z, submap, reset

  bind = , V, exec, vivaldi
  bind = , V, submap, reset


  bind = , E, submap, exemap-emacs
    submap = exemap-emacs, reset

    bind = , E, exec, emacsclient-def
    bind = , C, exec, emacsclient-code

submap = reset

bind = SUPER, return, exec, alacritty
bind = SUPER, backspace, exec, foot

bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r
bind = SUPER, P, cyclenext, prev
bind = SUPER, N, cyclenext, next

# vim
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r
# emacs
# USING scratchpads see
# bind = SUPER SHIFT, B, movewindow, l
# bind = SUPER SHIFT, N, movewindow, d
# bind = SUPER SHIFT, P, movewindow, u
# bind = SUPER SHIFT, F, movewindow, r

binde = SUPER ALT, B, resizeactive, -10 0
binde = SUPER ALT, N, resizeactive, 0 10
binde = SUPER ALT, P, resizeactive, 0 -10
binde = SUPER ALT, F, resizeactive, 10 0

# Switch workspaces with mainMod + [0-9]
$workspaceChangeDispatcher = focusworkspaceoncurrentmonitor
# "exec, hypr-workspace" deprecated by https://wiki.hyprland.org/Configuring/Dispatchers/#:~:text=focusworkspaceoncurrentmonitor
bind = SUPER, 1, $workspaceChangeDispatcher, 1
bind = SUPER, 2, $workspaceChangeDispatcher, 2
bind = SUPER, 3, $workspaceChangeDispatcher, 3
bind = SUPER, 4, $workspaceChangeDispatcher, 4
bind = SUPER, 5, $workspaceChangeDispatcher, 5
bind = SUPER, 6, $workspaceChangeDispatcher, 6
bind = SUPER, 7, $workspaceChangeDispatcher, 7
bind = SUPER, 8, $workspaceChangeDispatcher, 8
bind = SUPER, 9, $workspaceChangeDispatcher, 9
bind = SUPER, 0, $workspaceChangeDispatcher, 10

bind = SUPER ALT, 1, workspace, 1
bind = SUPER ALT, 2, workspace, 2
bind = SUPER ALT, 3, workspace, 3
bind = SUPER ALT, 4, workspace, 4
bind = SUPER ALT, 5, workspace, 5
bind = SUPER ALT, 6, workspace, 6
bind = SUPER ALT, 7, workspace, 7
bind = SUPER ALT, 8, workspace, 8
bind = SUPER ALT, 9, workspace, 9
bind = SUPER ALT, 0, workspace, 10

bind = SUPER SHIFT, S, swapactiveworkspaces, 0 1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
$moveToWorkspace = movetoworkspacesilent # default is movetoworkspace
bind = SUPER SHIFT, 1, $moveToWorkspace, 1
bind = SUPER SHIFT, 2, $moveToWorkspace, 2
bind = SUPER SHIFT, 3, $moveToWorkspace, 3
bind = SUPER SHIFT, 4, $moveToWorkspace, 4
bind = SUPER SHIFT, 5, $moveToWorkspace, 5
bind = SUPER SHIFT, 6, $moveToWorkspace, 6
bind = SUPER SHIFT, 7, $moveToWorkspace, 7
bind = SUPER SHIFT, 8, $moveToWorkspace, 8
bind = SUPER SHIFT, 9, $moveToWorkspace, 9
bind = SUPER SHIFT, 0, $moveToWorkspace, 10

# **** Scratchpads
# aka special workspaces
# bind = SUPER SHIFT, N, movetoworkspace, special:emacs-quick-note
# bind = SUPER, N, workspace, special:emacs-quick-note
bind = SUPER SHIFT, equal, movetoworkspacesilent,  special:scratch
bind = SUPER,       equal, togglespecialworkspace, special:scratch
bind = SUPER SHIFT, minus, movetoworkspacesilent,  special:minimized
bind = SUPER,       minus, togglespecialworkspace, special:minimized


# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# ytdotool debounce script for faulty middle click
# bind = , mouse:274, exec, ydotool click -D 200 0xC2 --repeat=1
# middle-click-debouce

bind = SUPER CTRL, P, pin,

# ## Layout binds
# bind = SUPER, F, fullscreen, 1

# https://github.com/hyprwm/Hyprland/issues/7770
bind = SUPER, F11, fullscreenstate, 2, -1

bind = SUPER, F, submap, wm-actions
submap = wm-actions
bind = SUPER, F, fullscreen, 1
source = ./catchall-reset-submap.conf
submap = reset

bind = SUPER, W, submap, wm-actions-group
submap = wm-actions-group
bind = , T, togglegroup
bind = , H, moveintogroup, l
bind = , J, moveintogroup, d
bind = , K, moveintogroup, u
bind = , L, moveintogroup, r
source = ./catchall-reset-submap.conf
submap = reset
bind = SUPER CTRL ALT, N, changegroupactive


# # MPD 2nd instance (deprecated)
# bind = SUPER ALT, XF86AudioNext, exec, playerctl --player=mpd-local next
# bind = SUPER ALT, XF86AudioPrev, exec, playerctl --player=mpd-local previous
# bind = SUPER ALT, XF86AudioPlay, exec, playerctl --player=mpd-local play-pause
# bind = SUPER ALT, XF86AudioStop, exec, playerctl --player=mpd-local stop

# [[https://github.com/xkbcommon/libxkbcommon/blob/master/include/xkbcommon/xkbcommon-keysyms.h][libxkbcommon/xkbcommon-keysyms.h at master · xkbcommon/libxkbcommon]]
bind = , print, exec, mkdir -p "$(xdg-user-dir PICTURES)/screenshots/" && grim -l 0 -t png "$(xdg-user-dir PICTURES)/screenshots/$(date +'%Y%m%d-%H%M%S-screenshot.png')" && notify-send -a Screenshot 'Fullscreen Screenshot taken'
# color picker: grim -g "$(slurp -p)" -t ppm - | magick - -format '%[pixel:p{0,0}]' txt:-

bind = SUPER CTRL ALT, pause, exec, uwsm stop

bind = SUPER, O, focusmonitor, +1
bind = SUPER SHIFT, O, movewindow, mon:+1
# exec, hyprctl dispatch movewindow mon:"$(hyprctl monitors -j | jq -r '.[] | select(.focused == false).id')"

# Notification contols
bind = SUPER CTRL ALT, N, exec, swaync-client --open-panel

# Switch keyboard layouts, find names with `hyprctl devices'
# bind = , control_r, exec, hyprctl switchxkblayout "$(pgrep kmonad && printf 'kmonad-uinput-sink' || printf 'sino-wealth-usb-keyboard')" next
# If using KMonad it will create a virtual keyboard device with the
# same name as defined in (uinput-sink ...) but with all lowercase an
# spaces replaces with hyphens, e.g.:
# `output (uinput-sink "KMonad uinput Sink"...)' will become kmonad-uinput-sink
# PS same works for kmonad:
bind = SUPER ALT, menu, exec, hyprctl switchxkblayout "$(pgrep -x xremap >/dev/null && printf 'xremap' || printf 'sino-wealth-usb-keyboard')" next

# pgrep kmonad > /dev/null && printf '%s\n' 'kmonad-uinput-sink' || printf 'sino-wealth-usb-keyboard\n'
# if pgrep kmonad > /dev/null; then printf '%s\n' 'kmonad-uinput-sink'; else printf 'sino-wealth-usb-keyboard\n'; fi

bind = SUPER CTRL ALT, period, exec, tofimoji

bind = SUPER CTRL ALT, M, exec, [float; stayfocused] terminal -w 120 -h 20 --float wiremix

bind = ALT, F4, exec, notify-send lmao

bind = SUPER CTRL ALT, D, exec, aria2-dragdrop

# Save last 60 seconds
bind = SUPER ALT, SPACE, exec, gpu-screen-recorder-replay-save

# Pause/resume replay buffer
bind = SUPER ALT, pause, exec, gpu-screen-recorder-replay-toggle

# Stop replay buffer entirely
bind = SUPER ALT, end, exec, gpu-screen-recorder-replay-stop

bind = SUPER ALT, F1, exec, gpu-screen-recorder-replay-save-10
bind = SUPER ALT, F2, exec, gpu-screen-recorder-replay-save-30
bind = SUPER ALT, F3, exec, gpu-screen-recorder-replay-save-60

bind = SUPER ALT, tab, exec, gpu-screen-recorder-replay-toggle-recording

# Media keys
# the recommended in http://wiki.hyprland.org/Configuring/Binds/#uncommon-syms--binding-with-a-keycode
# is to use lower case for keysyms, it it stops working capitalized y'know
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause

# MPD
bind = SUPER, XF86AudioNext, exec, playerctl --player=mpd next
bind = SUPER, XF86AudioPrev, exec, playerctl --player=mpd previous
bind = SUPER, XF86AudioPlay, exec, playerctl --player=mpd play-pause
bind = SUPER, XF86AudioStop, exec, playerctl --player=mpd stop
bind = SUPER, XF86AudioStop, exec, wptoggle

exec-once = wob-volume-pw
exec-once = wob-volume-pw-extras

binde = , XF86AudioLowerVolume, exec, pw-volume @DEFAULT_AUDIO_SINK@ 3-
binde = , XF86AudioRaiseVolume, exec, pw-volume @DEFAULT_AUDIO_SINK@ 3+

binde = SUPER ALT, XF86AudioLowerVolume, exec, env WOB_PIPE=/tmp/wob-game-sink.pipe pw-volume gamesink 5-
binde = SUPER ALT, XF86AudioRaiseVolume, exec, env WOB_PIPE=/tmp/wob-game-sink.pipe pw-volume gamesink 5+
binde = SUPER, XF86AudioLowerVolume, exec, env WOB_PIPE=/tmp/wob-firefox-sink.pipe pw-volume firefox-sink 5-
binde = SUPER, XF86AudioRaiseVolume, exec, env WOB_PIPE=/tmp/wob-firefox-sink.pipe pw-volume firefox-sink 5+
