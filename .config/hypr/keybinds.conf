# #### Binds ####
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER
$browser = firefox

bind = $mainMod, T, togglefloating,
bind = $mainMod, R, togglesplit, # dwindle

# [[https://github.com/hyprwm/Hyprland/issues/102][Submap of key bindings · Issue #102 · hyprwm/Hyprland]]
# [[https://wiki.hyprland.org/Configuring/Uncommon-tips--tricks/#disabling-keybinds-with-one-master-keybind][Uncommon Tips & Tricks | Hyprland Wiki]]
# custom
# $reset = && hyprctl dispatch submap reset
# usage: $reset at the end of `exec' keybinds
# alternative for non-exec: declare the same keybind again with the `submap, reset' after the first two fields for the keybind.
# remember to set a safety reset keybind e.g.: bind = $mainMod, G, submap, reset

# [[https://www.reddit.com/r/hyprland/comments/12q4xib/comment/jgqd0gw/][Activating lock/dpms from script with swayidle : r/hyprland]]
bindl = $mainMod ALT, pause, exec, hyprctl dispatch dpms off

bind = $mainMod, X, submap, exemap
submap = exemap
# bind = , space, exec, dmenu-def run $reset # dmenu script with custom command line options
# escape # with ##
# bind = , space, exec, bemenu-run --fn 'Liberation Mono' --nf '##f0f0f0' --sb '##76ee00' --sf '##111111' -i
bind = , space, exec, $(tofi-run)
bind = , space, submap, reset
bind = , C, killactive, # for kill with M-x c
bind = , C, submap, reset
bind = $mainMod, C, killactive, # for kill with M-x M-c
bind = $mainMod, C, submap, reset
bind = , E, exec, zsh -i -c 'exec emacs'
bind = , F, exec, firefox
bind = , Z, exec, zen-browser
bind = , V, exec, vivaldi
# bind = , N, exec, [workspace special:emacs-quick-note;noanim] emacs-launcher -- -c -e '(bookmark-jump "chronological-random-notes")'
# bind = , N, exec, emacs-launcher -- -c -e '(bookmark-jump "chronological-random-notes")'

source = ./catchall-reset-submap.conf
submap = reset

bind = $mainMod ALT, C, killactive, # for kill with s-M-c

bind = $mainMod, return, exec, alacritty
bind = $mainMod, backspace, exec, foot

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod, P, cyclenext, prev
bind = $mainMod, N, cyclenext, next

bind = $mainMod, S, swapsplit,

# vim
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
# emacs
# USING scratchpads see
# bind = $mainMod SHIFT, B, movewindow, l
# bind = $mainMod SHIFT, N, movewindow, d
# bind = $mainMod SHIFT, P, movewindow, u
# bind = $mainMod SHIFT, F, movewindow, r

binde = $mainMod ALT, B, resizeactive, -10 0
binde = $mainMod ALT, N, resizeactive, 0 10
binde = $mainMod ALT, P, resizeactive, 0 -10
binde = $mainMod ALT, F, resizeactive, 10 0

# Switch workspaces with mainMod + [0-9]
$workspaceChangeDispatcher = focusworkspaceoncurrentmonitor
# "exec, hypr-workspace" deprecated by https://wiki.hyprland.org/Configuring/Dispatchers/#:~:text=focusworkspaceoncurrentmonitor
bind = $mainMod, 1, $workspaceChangeDispatcher, 1
bind = $mainMod, 2, $workspaceChangeDispatcher, 2
bind = $mainMod, 3, $workspaceChangeDispatcher, 3
bind = $mainMod, 4, $workspaceChangeDispatcher, 4
bind = $mainMod, 5, $workspaceChangeDispatcher, 5
bind = $mainMod, 6, $workspaceChangeDispatcher, 6
bind = $mainMod, 7, $workspaceChangeDispatcher, 7
bind = $mainMod, 8, $workspaceChangeDispatcher, 8
bind = $mainMod, 9, $workspaceChangeDispatcher, 9
bind = $mainMod, 0, $workspaceChangeDispatcher, 10

bind = $mainMod ALT, 1, workspace, 1
bind = $mainMod ALT, 2, workspace, 2
bind = $mainMod ALT, 3, workspace, 3
bind = $mainMod ALT, 4, workspace, 4
bind = $mainMod ALT, 5, workspace, 5
bind = $mainMod ALT, 6, workspace, 6
bind = $mainMod ALT, 7, workspace, 7
bind = $mainMod ALT, 8, workspace, 8
bind = $mainMod ALT, 9, workspace, 9
bind = $mainMod ALT, 0, workspace, 10

bind = $mainMod SHIFT, S, swapactiveworkspaces, 0 1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
$moveToWorkspace = movetoworkspacesilent # default is movetoworkspace
bind = $mainMod SHIFT, 1, $moveToWorkspace, 1
bind = $mainMod SHIFT, 2, $moveToWorkspace, 2
bind = $mainMod SHIFT, 3, $moveToWorkspace, 3
bind = $mainMod SHIFT, 4, $moveToWorkspace, 4
bind = $mainMod SHIFT, 5, $moveToWorkspace, 5
bind = $mainMod SHIFT, 6, $moveToWorkspace, 6
bind = $mainMod SHIFT, 7, $moveToWorkspace, 7
bind = $mainMod SHIFT, 8, $moveToWorkspace, 8
bind = $mainMod SHIFT, 9, $moveToWorkspace, 9
bind = $mainMod SHIFT, 0, $moveToWorkspace, 10

# **** Scratchpads
# aka special workspaces
# bind = $mainMod SHIFT, N, movetoworkspace, special:emacs-quick-note
# bind = $mainMod, N, workspace, special:emacs-quick-note
bind = $mainMod SHIFT, equal, movetoworkspacesilent,  special:scratch
bind = $mainMod,       equal, togglespecialworkspace, special:scratch
bind = $mainMod SHIFT, minus, movetoworkspacesilent,  special:minimized
bind = $mainMod,       minus, togglespecialworkspace, special:minimized


# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ytdotool debounce script for faulty middle click
# bind = , mouse:274, exec, ydotool click -D 200 0xC2 --repeat=1
# middle-click-debouce

bind = $mainMod CTRL, P, pin,

# ## Layout binds
# bind = $mainMod, F, fullscreen, 1

# https://github.com/hyprwm/Hyprland/issues/7770
bind = $mainMod, F11, fullscreenstate, 2, -1

bind = $mainMod, F, submap, wm-actions
submap = wm-actions
bind = $mainMod, F, fullscreen, 1
source = ./catchall-reset-submap.conf
submap = reset

bind = $mainMod, W, submap, wm-actions-group
submap = wm-actions-group
bind = , T, togglegroup
bind = , H, moveintogroup, l
bind = , J, moveintogroup, d
bind = , K, moveintogroup, u
bind = , L, moveintogroup, r
source = ./catchall-reset-submap.conf
submap = reset
bind = $mainMod CTRL ALT, N, changegroupactive


# # MPD 2nd instance (deprecated)
# bind = $mainMod ALT, XF86AudioNext, exec, playerctl --player=mpd-local next
# bind = $mainMod ALT, XF86AudioPrev, exec, playerctl --player=mpd-local previous
# bind = $mainMod ALT, XF86AudioPlay, exec, playerctl --player=mpd-local play-pause
# bind = $mainMod ALT, XF86AudioStop, exec, playerctl --player=mpd-local stop

# [[https://github.com/xkbcommon/libxkbcommon/blob/master/include/xkbcommon/xkbcommon-keysyms.h][libxkbcommon/xkbcommon-keysyms.h at master · xkbcommon/libxkbcommon]]
bind = , print, exec, mkdir -p "$(xdg-user-dir PICTURES)/screenshots/" && grim -l 0 -t png "$(xdg-user-dir PICTURES)/screenshots/$(date +'%Y%m%d-%H%M%S-screenshot.png')" && notify-send -a Screenshot 'Fullscreen Screenshot taken'
# color picker: grim -g "$(slurp -p)" -t ppm - | magick - -format '%[pixel:p{0,0}]' txt:-

# Hang when using default exit:
# FIX wizard https://github.com/hyprwm/Hyprland/issues/3558#issuecomment-1848768654
bind = $mainMod CTRL ALT, pause, exec, hyprctl dispatch exit 0; sleep 2; pgrep -x Hyprland >/dev/null && killall -9 Hyprland

bind = $mainMod, O, focusmonitor, +1
bind = $mainMod SHIFT, O, movewindow, mon:+1
# exec, hyprctl dispatch movewindow mon:"$(hyprctl monitors -j | jq -r '.[] | select(.focused == false).id')"

# Notification contols
bind = $mainMod CTRL ALT, N, exec, dunstctl history-pop

# Reload second monitor to set the primary monitor:
bind = $mainMod CTRL ALT, D, exec, wlr-randr --output DP-2 --off && sleep 1 && wlr-randr --output DP-2 --on --pos 2048,122

# Switch keyboard layouts, find names with `hyprctl devices'
# bind = , control_r, exec, hyprctl switchxkblayout "$(pgrep kmonad && printf 'kmonad-uinput-sink' || printf 'sino-wealth-usb-keyboard')" next
# If using KMonad it will create a virtual keyboard device with the
# same name as defined in (uinput-sink ...) but with all lowercase an
# spaces replaces with hyphens, e.g.:
# `output (uinput-sink "KMonad uinput Sink"...)' will become kmonad-uinput-sink
# PS same works for kmonad:
bind = $mainMod ALT, control_r, exec, hyprctl switchxkblayout "$(pgrep -x xremap >/dev/null && printf 'xremap' || printf 'sino-wealth-usb-keyboard')" next

# pgrep kmonad > /dev/null && printf '%s\n' 'kmonad-uinput-sink' || printf 'sino-wealth-usb-keyboard\n'
# if pgrep kmonad > /dev/null; then printf '%s\n' 'kmonad-uinput-sink'; else printf 'sino-wealth-usb-keyboard\n'; fi

bind = $mainMod CTRL ALT, period, exec, tofimoji

bind = $mainMod CTRL ALT, M, exec, [float; stayfocused] terminal -w 120 -h 20 --float pulsemixer

# Save last 60 seconds
bind = $mainMod ALT, SPACE, exec, gpu-screen-recorder-replay-save

# Pause/resume replay buffer
bind = $mainMod, pause, exec, gpu-screen-recorder-replay-toggle

# Stop replay buffer entirely
bind = $mainMod, end, exec, gpu-screen-recorder-replay-stop

bind = , F1, exec, gpu-screen-recorder-replay-save-10
bind = , F2, exec, gpu-screen-recorder-replay-save-30
bind = , Capslock, exec, gpu-screen-recorder-replay-save-30
bind = , F3, exec, gpu-screen-recorder-replay-save-60

# Media keys
# the recommended in http://wiki.hyprland.org/Configuring/Binds/#uncommon-syms--binding-with-a-keycode
# is to use lower case for keysyms, it it stops working capitalized y'know
bind = $mainMod, XF86AudioNext, exec, playerctl next
bind = $mainMod, XF86AudioPrev, exec, playerctl previous
bind = $mainMod, XF86AudioPlay, exec, playerctl play-pause
bind = $mainMod, XF86AudioStop, exec, wptoggle
# MPD
bind = , XF86AudioNext, exec, playerctl --player=mpd next
bind = , XF86AudioPrev, exec, playerctl --player=mpd previous
bind = , XF86AudioPlay, exec, playerctl --player=mpd play-pause
bind = , XF86AudioStop, exec, playerctl --player=mpd stop

exec-once = wob-volume # script

binde = , XF86AudioLowerVolume, exec, pw-volume @DEFAULT_AUDIO_SINK@ 1-
binde = , XF86AudioRaiseVolume, exec, pw-volume @DEFAULT_AUDIO_SINK@ 1+

binde = $mainMod ALT, XF86AudioLowerVolume, exec, pw-volume gamesink 5-
binde = $mainMod ALT, XF86AudioRaiseVolume, exec, pw-volume gamesink 5+
binde = $mainMod, XF86AudioLowerVolume, exec, pw-volume firefox-sink 5-
binde = $mainMod, XF86AudioRaiseVolume, exec, pw-volume firefox-sink 5+
