[general]
# only full paths are supported https://github.com/alacritty/alacritty/pull/7690
import = [ "~/.config/alacritty/themes/current-theme.toml" ]

[env]
TERM = "xterm-256color"

[font]
# draw_bold_text_with_bright_colors = false
size = 11

[font.bold]
family = "Literation Mono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Literation Mono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Literation Mono Nerd Font"
style = "Italic"

[font.normal]
family = "Literation Mono Nerd Font"
style = "Regular"

[keyboard]
bindings = [
{ action = "Paste", key = "Y", mode = "~Vi", mods = "Control|Alt" },
{ action = "Copy", key = "W", mods = "Control|Alt" },
]

[mouse]
bindings = [
{ action = "Paste", mouse = "Middle" },
{ action = "Copy", mouse = "Right" }
]

[scrolling]
history = 10000
multiplier = 3

[window]
dimensions = { columns = 236, lines = 50 }
padding = { x = 12, y = 12 }
# opacity = 0.92
