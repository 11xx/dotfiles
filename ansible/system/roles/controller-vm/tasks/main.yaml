- name: Create VM directory
  ansible.builtin.file:
    path: "{{ xbox_vm_dir }}"
    state: directory
    mode: "0750"

- name: 'Check if VM directory exists'
  ansible.builtin.stat:
    path: "{{ xbox_vm_dir }}"
  register: xbox_vm_dir_stat

- name: Copy writable OVMF VARS into VM directory
  ansible.builtin.copy:
    src: "{{ ovmf_vars_src }}"
    dest: "{{ xbox_vm_dir }}/OVMF_VARS.fd"
    remote_src: true
    force: false          # preserve any existing firmware state
    mode: "0600"
  when: xbox_vm_dir_stat.stat.exists and xbox_vm_dir_stat.stat.isdir

- name: Create qcow2 disk image (idempotent — skip if already present)
  ansible.builtin.command:
    cmd: >
      qemu-img create -f qcow2
      {{ xbox_vm_dir }}/{{ xbox_vm_disk }}
      {{ xbox_vm_disk_size }}
    creates: "{{ xbox_vm_dir }}/{{ xbox_vm_disk }}"

- name: Install udev rules for controller USB passthrough
  ansible.builtin.copy:
    content: |
      # Xbox Wireless Adapter
      SUBSYSTEM=="usb", ATTR{idVendor}=="{{ xbox_dongle_vendor }}", ATTR{idProduct}=="{{ xbox_dongle_product }}", MODE="0660", GROUP="kvm", TAG+="uaccess"

      # Xbox wired controller
      SUBSYSTEM=="usb", ATTR{idVendor}=="{{ xbox_controller_vendor }}", ATTR{idProduct}=="{{ xbox_controller_product }}", MODE="0660", GROUP="kvm", TAG+="uaccess"

      # 8BitDo UM 2 Receiver - active controller mode
      SUBSYSTEM=="usb", ATTR{idVendor}=="{{ bitdo_vendor }}", ATTR{idProduct}=="{{ bitdo_receiver_active_product }}", MODE="0660", GROUP="kvm", TAG+="uaccess"

      # 8BitDo UM 2 Receiver - idle/update/fallback mode
      SUBSYSTEM=="usb", ATTR{idVendor}=="{{ bitdo_vendor }}", ATTR{idProduct}=="{{ bitdo_receiver_idle_product }}", MODE="0660", GROUP="kvm", TAG+="uaccess"

      # Optional: 8BitDo exposed as Nintendo Switch Pro Controller
      SUBSYSTEM=="usb", ATTR{idVendor}=="{{ nintendo_vendor }}", ATTR{idProduct}=="{{ nintendo_pro_product }}", MODE="0660", GROUP="kvm", TAG+="uaccess"

      # 8BitDo WebUSB/WebHID access on host, useful for web.8bitdo.com before VM passthrough
      KERNEL=="hidraw*", ATTRS{idVendor}=="{{ bitdo_vendor }}", MODE="0660", GROUP="users", TAG+="uaccess"
    dest: /etc/udev/rules.d/80-controller-usb-passthrough.rules
    mode: "0644"
  become: true
  notify:
    - Reload udev rules

- name: Create qcow2 disk image (idempotent — skip if already present)
  ansible.builtin.command:
    cmd: >
      qemu-img create -f qcow2
      {{ xbox_vm_dir }}/{{ xbox_vm_disk }}
      {{ xbox_vm_disk_size }}
    creates: "{{ xbox_vm_dir }}/{{ xbox_vm_disk }}"

