- name: Copy one-time Windows installer script to /tmp
  ansible.builtin.copy:
    content: |
      #!/usr/bin/env bash
      # ONE-TIME Windows installation boot — run once, then delete.
      # Disk:    IDE (no driver needed during setup)
      # Network: rtl8139 (built-in Windows driver, no extras needed)
      # VirtIO:  driver ISO attached as second CD so it can be installed
      #          during setup — run virtio-win-gt-x64.exe from the mounted ISO.
      # Usage: bash /tmp/xbox-vm-install-oneshot.sh
      set -euo pipefail

      VM_DIR="{{ xbox_vm_dir }}"

      : "${WINDOWS_ISO:?Set WINDOWS_ISO=/path/to/Win10.iso}"

      exec qemu-system-x86_64 \
        -enable-kvm \
        -cpu host \
        -machine type=q35,accel=kvm \
        -m {{ xbox_vm_ram }} \
        -drive if=pflash,format=raw,readonly=on,file={{ ovmf_code }} \
        -drive if=pflash,format=raw,file="${VM_DIR}/OVMF_VARS.fd" \
        -drive file="${VM_DIR}/{{ xbox_vm_disk }}",if=ide,format=qcow2 \
        -drive file="${WINDOWS_ISO}",media=cdrom,if=ide \
        -drive file="${VM_DIR}/virtio-win.iso",media=cdrom,if=ide \
        -nic user,model=rtl8139 \
        -display gtk,grab-on-hover=on \
        -device qemu-xhci,id=xhci \
        -device usb-tablet \
        -boot order=d
    dest: /tmp/xbox-vm-install-oneshot.sh
    mode: "0750"

- name: Print one-time installer instructions
  ansible.builtin.debug:
    msg: >-
      One-time installer written to /tmp/xbox-vm-install-oneshot.sh.
      Run: WINDOWS_ISO=/path/to/Win10.iso bash /tmp/xbox-vm-install-oneshot.sh
      During setup: install virtio-win-gt-x64.exe from the mounted VirtIO ISO.
      Delete after Windows installation is complete.

- name: Install VM start script
  ansible.builtin.copy:
    content: |
      #!/usr/bin/env bash
      # Managed by Ansible — do not edit by hand
      set -euo pipefail

      VM_DIR="{{ xbox_vm_dir }}"
      cd "$VM_DIR"

      usb_args=()

      add_usb_if_present() {
        local vendor="$1"
        local product="$2"
        local label="$3"

        if lsusb -d "${vendor}:${product}" >/dev/null 2>&1; then
          echo "Passing through ${label}: ${vendor}:${product}"
          usb_args+=(
            -device "usb-host,bus=xhci.0,vendorid=0x${vendor},productid=0x${product}"
          )
        else
          echo "Not present: ${label}: ${vendor}:${product}"
        fi
      }

      # Release host drivers that may bind Xbox-like controller paths.
      sudo modprobe -r xone 2>/dev/null || true
      sudo modprobe -r xpad 2>/dev/null || true

      # Do not reload xpad automatically here; it may immediately grab 8BitDo again.
      trap 'sudo modprobe xone 2>/dev/null || true' EXIT

      add_usb_if_present "{{ xbox_dongle_vendor }}" "{{ xbox_dongle_product }}" "Xbox Wireless Adapter"
      add_usb_if_present "{{ xbox_controller_vendor }}" "{{ xbox_controller_product }}" "Xbox wired controller"

      add_usb_if_present "{{ bitdo_vendor }}" "{{ bitdo_receiver_active_product }}" "8BitDo UM2 receiver active mode"
      add_usb_if_present "{{ bitdo_vendor }}" "{{ bitdo_receiver_idle_product }}" "8BitDo UM2 receiver idle/update mode"
      add_usb_if_present "{{ nintendo_vendor }}" "{{ nintendo_pro_product }}" "8BitDo/Switch Pro mode"

      exec qemu-system-x86_64 \
        -enable-kvm \
        -cpu host \
        -machine type=q35,accel=kvm \
        -m {{ xbox_vm_ram }} \
        -drive if=pflash,format=raw,readonly=on,file={{ ovmf_code }} \
        -drive if=pflash,format=raw,file="${VM_DIR}/OVMF_VARS.fd" \
        -drive file="${VM_DIR}/{{ xbox_vm_disk }}",if=ide,format=qcow2 \
        -nic user,model=virtio-net-pci \
        -display gtk,grab-on-hover=on \
        -device qemu-xhci,id=xhci \
        -device usb-tablet \
        "${usb_args[@]}" \
        -boot order=c
    dest: "{{ xbox_vm_dir }}/start-controller-vm.sh"
    mode: "0750"

- name: Ensure local applications directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/applications"
    state: directory
    mode: "0755"

- name: Install desktop launcher
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Type=Application
      Name=Windows (Controller Tools)
      Comment=Windows VM for Xbox Accessories and 8BitDo Ultimate Software
      Exec={{ xbox_vm_dir }}/start-controller-vm.sh
      Icon=computer
      Terminal=false
      Categories=System;Emulator;
    dest: "{{ ansible_env.HOME }}/.local/share/applications/win-xbox-controller.desktop"
    mode: "0644"

- name: Update desktop database
  ansible.builtin.command:
    cmd: update-desktop-database "{{ ansible_env.HOME }}/.local/share/applications"
  changed_when: false
