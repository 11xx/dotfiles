- name: Install default shell deps
  ansible.builtin.package:
    name:
      - zsh
      - bash-completion
      - atuin # history
      - zoxide # cd alternative
      - fzf # for zoxide & atuin
      - rename # (perl)
      - grc # garabik/grc "generic colouriser"
    state: present
  become: true

- name: Install better CLI programs
  ansible.builtin.package:
    name:
      - bat
      - fd-find
      - eza
      - ripgrep
      - duf
      - btop
      - fzf
      - ncdu
      - nnn
      - rsync
    state: present
  become: true

- name: Create fd symlink (Debian names binary fdfind)
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
  become: true

- ansible.builtin.import_role:
    name: shell
    tasks_from: zsh-antidote
