---
- name: 'aiagent: Create private configuration and state directories'
  tags: ['gak-aiagent-image']
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '0700'
  loop:
    - /home/aiagent/.config
    - /home/aiagent/.config/containers
    - /home/aiagent/.local
    - /home/aiagent/.local/bin
    - /home/aiagent/podman
    - /home/aiagent/podman/storage
    - /home/aiagent/podman/runroot
    - /home/aiagent/tmp
    - /home/aiagent/image-copy-tmp
    - /home/aiagent/services
    - /home/aiagent/services/agent
    - /home/aiagent/container-home
    - /home/aiagent/workspaces
    - /home/aiagent/cache
    - /home/aiagent/image

- name: 'aiagent: Install private Podman configuration'
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/home/aiagent/.config/containers/{{ item }}'
    mode: '0600'
  loop:
    - containers.conf
    - storage.conf

- name: 'aiagent: Install Compose lifecycle helper'
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/roles/gak_compose/files/gak-compose-lifecycle'
    dest: /home/aiagent/.local/bin/gak-compose-lifecycle
    mode: '0750'

- name: 'aiagent: Install Podman state reconciler'
  ansible.builtin.copy:
    src: gak-aiagent-reconcile
    dest: /home/aiagent/.local/bin/gak-aiagent-reconcile
    mode: '0750'

- name: 'aiagent: Install image build context'
  tags: ['gak-aiagent-image']
  ansible.builtin.copy:
    src: image/
    dest: /home/aiagent/image/
    mode: '0600'
    directory_mode: '0700'

- name: 'aiagent: Install account command'
  tags: ['gak-aiagent-image']
  ansible.builtin.copy:
    src: aiagent
    dest: /home/aiagent/.local/bin/aiagent
    mode: '0750'

- name: 'aiagent: Install declared instance lists'
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '/home/aiagent/services/{{ item.name }}'
    mode: '0600'
  loop:
    - { name: '.compose-supported', content: "agent\n" }
    - { name: '.compose-applications', content: "agent\n" }
    - { name: '.compose-autostart', content: "agent\n" }
    - { name: '.compose-never-autostart', content: '' }
    - { name: '.compose-networks', content: '' }

- name: 'aiagent: Install the agent project'
  tags: ['gak-aiagent-image']
  ansible.builtin.copy:
    src: agent-compose.yaml
    dest: /home/aiagent/services/agent/compose.yaml
    mode: '0600'

- name: 'aiagent: Remove the boot smoke project declaration'
  ansible.builtin.file:
    path: /home/aiagent/services/smoke/compose.yaml
    state: absent
