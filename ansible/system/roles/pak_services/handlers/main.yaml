---
- name: Reload pak user units
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  when: pak_services_activate | bool

- name: Restart pak pihole
  ansible.builtin.systemd_service:
    name: pak-pihole-unbound.service
    state: restarted
    scope: user
  when: pak_services_activate | bool

- name: Restart pak vaultwarden
  ansible.builtin.systemd_service:
    name: pak-vaultwarden.service
    state: restarted
    scope: user
  when: pak_services_activate | bool

- name: Restart pak caddy
  ansible.builtin.systemd_service:
    name: pak-caddy.service
    state: restarted
    scope: user
  when: pak_services_activate | bool
