- name: Install openssh
  community.general.pacman:
    name:
      - openssh
    state: present

- name: Set custom SSH port
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Port'
    line: "Port {{ ssh_port }}"
    validate: '/usr/bin/sshd -t -f %s'
  notify: Restart sshd

- name: Enable and start sshd service
  ansible.builtin.systemd_service:
    name: sshd.service
    state: started
    enabled: true
