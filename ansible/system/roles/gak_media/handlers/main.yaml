---
# Only restarts a stack that is already running. The unit is installed without
# being enabled or started, so on a host where the stack is deliberately down, a
# config change must not be what brings seven containers — a torrent client and
# a usenet client among them — up for the first time.
#
# Starting it is a decision, taken once by hand:
#   systemctl --user enable --now starrs
- name: Restart starrs
  ansible.builtin.systemd_service:
    name: starrs.service
    state: restarted
    daemon_reload: true
    scope: user
  when:
    - not ansible_check_mode
    - gak_media_unit_active
