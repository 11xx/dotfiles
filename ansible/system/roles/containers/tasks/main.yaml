---
- name: 'containers: Install the OCI runtime'
  community.general.pacman:
    name:
      - crun
    state: present
    extra_args: --asdeps
  become: true
  tags: ['containers-packages']

- name: 'containers: Install podman'
  community.general.pacman:
    name:
      - podman
      - podman-compose
    state: present
  become: true
  tags: ['containers-packages']

- name: 'containers: Map subuid/subgid ranges for rootless containers'
  ansible.builtin.include_tasks: uidmap.yaml
  tags: ['containers-uidmap']

- name: 'containers: Create the user containers config directory'
  ansible.builtin.file:
    path: "{{ xdg_config_home }}/containers/registries.conf.d"
    state: directory
    mode: "0755"
  tags: ['containers-config']

# Podman refuses a bare `podman run nginx` unless a search registry is set,
# rather than guessing at Docker Hub the way docker does.
# https://wiki.archlinux.org/title/Podman#Registries
- name: 'containers: Enable unqualified image searches'
  ansible.builtin.lineinfile:
    path: "{{ xdg_config_home }}/containers/registries.conf.d/10-unqualified-search-registries.conf"
    line: 'unqualified-search-registries = ["docker.io"]'
    create: true
    mode: "0644"
  tags: ['containers-config']

# overlay is podman's own default, so pinning it in storage.conf only creates a
# file that can drift out of step with future defaults. Removed rather than
# written — which is what this task always did, despite once being named for
# the opposite.
- name: 'containers: Drop the redundant storage driver override'
  ansible.builtin.file:
    path: "{{ xdg_config_home }}/containers/storage.conf"
    state: absent
  tags: ['containers-config']
