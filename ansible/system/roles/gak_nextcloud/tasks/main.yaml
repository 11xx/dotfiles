---
- ansible.builtin.file:
    mode: '{{ item.mode }}'
    path: '{{ item.path }}'
    state: directory
  loop:
  - path: '{{ ansible_facts.user_dir }}/services'
    mode: '0755'
  - path: '{{ gak_services_bin_dir }}'
    mode: '0755'
  - path: '{{ gak_nextcloud_dir }}'
    mode: '0750'
  - path: '{{ gak_nextcloud_dir }}/html'
    mode: '0750'
  - path: '{{ gak_nextcloud_dir }}/postgres'
    mode: '0700'
  - path: '{{ gak_nextcloud_dir }}/secrets'
    mode: '0710'
  - path: '{{ gak_nextcloud_dir }}/backup-staging'
    mode: '0700'
  - path: '{{ gak_nextcloud_backup_dir }}'
    mode: '0700'
  - path: '{{ gak_nextcloud_backup_dir }}/restic'
    mode: '0700'
  loop_control:
    label: '{{ item.path }}'
  name: 'gak_nextcloud: Create the stack directory tree'
  tags:
  - gak-nextcloud-config
  - gak-nextcloud-secrets
- name: 'gak_nextcloud: Deploy the nextcloud secret files'
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '{{ gak_nextcloud_dir }}/secrets/{{ item.name }}'
    mode: '{{ item.mode }}'
  loop:
  - name: postgres-password
    content: '{{ nextcloud_postgres_password }}'
    mode: '0600'
  - name: admin-password
    content: '{{ nextcloud_admin_password }}'
    mode: '0600'
  - name: redis-password
    content: '{{ nextcloud_redis_password }}'
    mode: '0640'
  - name: restic-password
    content: '{{ nextcloud_restic_password }}'
    mode: '0600'
  loop_control:
    label: '{{ item.name }}'
  no_log: true
  tags:
  - gak-nextcloud-config
  - gak-nextcloud-secrets
- name: 'gak_nextcloud: Deploy the nextcloud daily-user password environment'
  ansible.builtin.copy:
    content: 'OC_PASS={{ nextcloud_user_password }}

      '
    dest: '{{ gak_nextcloud_dir }}/secrets/daily-user.env'
    mode: '0600'
  no_log: true
  tags:
  - gak-nextcloud-config
  - gak-nextcloud-secrets
- name: 'gak_nextcloud: Deploy the private redis configuration'
  ansible.builtin.template:
    src: redis.conf.j2
    dest: '{{ gak_nextcloud_dir }}/secrets/redis.conf'
    mode: '0640'
  no_log: true
  tags:
  - gak-nextcloud-config
  - gak-nextcloud-secrets
- name: 'gak_nextcloud: Let nextcloud traverse its secret directory'
  ansible.builtin.command:
    argv:
    - podman
    - unshare
    - chown
    - 0:33
    - '{{ gak_nextcloud_dir }}/secrets'
  changed_when: false
  when: not ansible_check_mode
  tags:
  - gak-nextcloud-config
  - gak-nextcloud-secrets
- name: 'gak_nextcloud: Let nextcloud read its redis password'
  ansible.builtin.command:
    argv:
    - podman
    - unshare
    - chown
    - 0:33
    - '{{ gak_nextcloud_dir }}/secrets/redis-password'
  changed_when: false
  when: not ansible_check_mode
  tags:
  - gak-nextcloud-config
  - gak-nextcloud-secrets
- name: 'gak_nextcloud: Give postgres its state directory'
  ansible.builtin.command:
    argv:
    - podman
    - unshare
    - chown
    - 70:70
    - '{{ gak_nextcloud_dir }}/postgres'
  changed_when: false
  when: not ansible_check_mode
  tags:
  - gak-nextcloud-config
- name: 'gak_nextcloud: Let redis read its private configuration'
  ansible.builtin.command:
    argv:
    - podman
    - unshare
    - chown
    - 0:1000
    - '{{ gak_nextcloud_dir }}/secrets/redis.conf'
  changed_when: false
  when: not ansible_check_mode
  tags:
  - gak-nextcloud-config
  - gak-nextcloud-secrets
- ansible.builtin.template:
    dest: '{{ gak_services_bin_dir }}/{{ item.dest }}'
    mode: '0755'
    src: '{{ item.src }}'
  loop:
  - src: nextcloud-backup.j2
    dest: gak-nextcloud-backup
  - src: nextcloud-restore-check.j2
    dest: gak-nextcloud-restore-check
  - src: nextcloud-update-ready.j2
    dest: gak-nextcloud-update-ready
  loop_control:
    label: '{{ item.dest }}'
  name: 'gak_nextcloud: Deploy nextcloud operator commands'
  tags:
  - gak-nextcloud-config
  - gak-compose-config
- name: 'gak_nextcloud: Deploy the Compose project'
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: '{{ gak_nextcloud_dir }}/compose.yaml'
    mode: '0644'
  tags:
  - gak-nextcloud-config
  - gak-compose-config
- name: 'gak_nextcloud: Deploy the lifecycle stop order'
  ansible.builtin.copy:
    src: compose-stop-order
    dest: '{{ gak_nextcloud_dir }}/.compose-stop-order'
    mode: '0644'
  tags:
  - gak-nextcloud-config
  - gak-compose-config
- name: 'gak_nextcloud: Check whether nextcloud is available for bootstrap'
  ansible.builtin.command:
    argv:
    - podman
    - container
    - exists
    - nextcloud
  register: gak_nextcloud_container
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  tags:
  - gak-nextcloud-bootstrap
- name: 'gak_nextcloud: Read nextcloud application state'
  ansible.builtin.command:
    argv:
    - podman
    - exec
    - --user
    - '33'
    - nextcloud
    - php
    - occ
    - app:list
    - --output=json
  register: gak_nextcloud_apps
  changed_when: false
  when:
  - not ansible_check_mode
  - gak_nextcloud_container.rc == 0
  tags:
  - gak-nextcloud-bootstrap
- name: 'gak_nextcloud: Install the calendar application'
  ansible.builtin.command:
    argv:
    - podman
    - exec
    - --user
    - '33'
    - nextcloud
    - php
    - occ
    - app:install
    - calendar
  when:
  - not ansible_check_mode
  - gak_nextcloud_container.rc == 0
  - '''calendar'' not in ((gak_nextcloud_apps.stdout | from_json).enabled | default({}))'
  - '''calendar'' not in ((gak_nextcloud_apps.stdout | from_json).disabled | default({}))'
  tags:
  - gak-nextcloud-bootstrap
- name: 'gak_nextcloud: Enable the calendar application'
  ansible.builtin.command:
    argv:
    - podman
    - exec
    - --user
    - '33'
    - nextcloud
    - php
    - occ
    - app:enable
    - calendar
  register: gak_nextcloud_calendar
  changed_when: '''already enabled'' not in gak_nextcloud_calendar.stdout'
  when:
  - not ansible_check_mode
  - gak_nextcloud_container.rc == 0
  tags:
  - gak-nextcloud-bootstrap
- name: 'gak_nextcloud: Check for the nextcloud daily account'
  ansible.builtin.command:
    argv:
    - podman
    - exec
    - --user
    - '33'
    - nextcloud
    - php
    - occ
    - user:info
    - '{{ gak_nextcloud_user }}'
    - --output=json
  register: gak_nextcloud_user_info
  changed_when: false
  failed_when: false
  when:
  - not ansible_check_mode
  - gak_nextcloud_container.rc == 0
  tags:
  - gak-nextcloud-bootstrap
- name: 'gak_nextcloud: Create the nextcloud daily account'
  ansible.builtin.command:
    argv:
    - podman
    - exec
    - --env-file
    - '{{ gak_nextcloud_dir }}/secrets/daily-user.env'
    - --user
    - '33'
    - nextcloud
    - php
    - occ
    - user:add
    - --password-from-env
    - --display-name
    - '{{ gak_nextcloud_user_display_name }}'
    - '{{ gak_nextcloud_user }}'
  no_log: true
  when:
  - not ansible_check_mode
  - gak_nextcloud_container.rc == 0
  - gak_nextcloud_user_info.rc != 0
  tags:
  - gak-nextcloud-bootstrap
- name: 'gak_nextcloud: Select cron for nextcloud background work'
  ansible.builtin.command:
    argv:
    - podman
    - exec
    - --user
    - '33'
    - nextcloud
    - php
    - occ
    - background:cron
  register: gak_nextcloud_background
  changed_when: '''cron'' not in gak_nextcloud_background.stdout | lower'
  when:
  - not ansible_check_mode
  - gak_nextcloud_container.rc == 0
  tags:
  - gak-nextcloud-bootstrap
- name: 'gak_nextcloud: Set nextcloud phone-region defaults'
  ansible.builtin.command:
    argv:
    - podman
    - exec
    - --user
    - '33'
    - nextcloud
    - php
    - occ
    - config:system:set
    - default_phone_region
    - --value=BR
  changed_when: false
  when:
  - not ansible_check_mode
  - gak_nextcloud_container.rc == 0
  tags:
  - gak-nextcloud-bootstrap
- name: 'gak_nextcloud: Set nextcloud maintenance window'
  ansible.builtin.command:
    argv:
    - podman
    - exec
    - --user
    - '33'
    - nextcloud
    - php
    - occ
    - config:system:set
    - maintenance_window_start
    - --type=integer
    - --value=5
  changed_when: false
  when:
  - not ansible_check_mode
  - gak_nextcloud_container.rc == 0
  tags:
  - gak-nextcloud-bootstrap
