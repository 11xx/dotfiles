---
gak_nextcloud_service_name: nextcloud
gak_nextcloud_hostname: '{{ gak_nextcloud_service_name }}.{{ gak_tailnet_dns_suffix }}'
gak_nextcloud_port: 8080
gak_nextcloud_admin_user: nextcloud-admin
gak_nextcloud_user: lobo
gak_nextcloud_user_display_name: Lobo
# Keep the application on major 34 and the companion services on their
# declared major/series channels. Pulling a newer tag is an explicit operator
# action followed by Compose recreation and application checks.
gak_nextcloud_image: docker.io/library/nextcloud:34-apache
gak_nextcloud_postgres_image: docker.io/library/postgres:17-alpine
gak_nextcloud_redis_image: docker.io/library/redis:8.2-alpine
gak_nextcloud_backup_dir: /marak/backups/nextcloud
gak_nextcloud_dir: '{{ ansible_facts[''user_dir''] }}/services/nextcloud'
