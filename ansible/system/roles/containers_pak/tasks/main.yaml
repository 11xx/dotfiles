---
# Rootless podman on pak, which is what lets the LAN services stack run as the
# login user instead of root.
#
# Firewall rules are deliberately not set here. They live in host_vars/pak/ufw,
# because the firewall role resets ufw before applying that list — so anything
# opened from this role was silently wiped on the next play.

- name: 'containers: Install rootless podman and its dependencies'
  ansible.builtin.apt:
    name:
      - podman
      - podman-compose
      - uidmap           # newuidmap/newgidmap, the thing that makes it rootless
      - passt            # user-mode networking
      - slirp4netns      # passt's predecessor, still the fallback
      - fuse-overlayfs
      - crun
      - ca-certificates
      - acl              # needed for become to an unprivileged user
    state: present
    update_cache: true
  become: true
  tags: ['containers-packages']

- name: 'containers: Map subuid/subgid ranges for rootless containers'
  ansible.builtin.import_role:
    name: containers
    tasks_from: uidmap
  tags: ['containers-uidmap']

# Without lingering, the user's systemd instance stops at logout and takes the
# whole stack with it. On a headless box nobody is logged in at all.
- name: 'containers: Check whether lingering is already enabled'
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ ansible_user }}"
  register: pak_linger
  tags: ['containers-linger']

- name: 'containers: Enable lingering for the service user'
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_user }}"
  become: true
  when: not pak_linger.stat.exists
  tags: ['containers-linger']

- name: 'containers: Let unprivileged processes bind from port 53 up'
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "53"
    sysctl_file: /etc/sysctl.d/unprivileged-port.conf
    reload: true
  become: true
  tags: ['containers-sysctl']

# A Pi 4 serving DNS for the house has a lot of small sockets open at once, and
# the stock buffers are sized for a desktop.
- name: 'containers: Widen network buffers for container traffic'
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/increase-mem.conf
    reload: true
  loop:
    - { name: net.core.wmem_max, value: "25165824" }
    - { name: net.core.rmem_max, value: "25165824" }
    - { name: net.ipv4.tcp_rmem, value: "20480 174760 25165824" }
    - { name: net.ipv4.tcp_wmem, value: "20480 174760 25165824" }
    - { name: net.ipv4.tcp_window_scaling, value: "1" }
    - { name: net.ipv4.tcp_timestamps, value: "1" }
    - { name: net.ipv4.tcp_sack, value: "1" }
    - { name: net.ipv4.tcp_no_metrics_save, value: "1" }
    - { name: net.core.netdev_max_backlog, value: "10000" }
  become: true
  loop_control:
    label: "{{ item.name }}"
  tags: ['containers-sysctl']

- name: 'containers: Gather installed packages'
  ansible.builtin.package_facts:
    manager: auto
  tags: ['containers-dns']

# Pi-hole needs port 53, and resolved's stub listener already holds it. The
# restart is a handler rather than an unconditional task: run every play, it
# reported a change every time and briefly took DNS down with it.
- name: "containers: Free port 53 from systemd-resolved's stub listener"
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNSStubListener='
    line: 'DNSStubListener=no'
    backup: true
    create: true
    mode: "0644"
    owner: root
    group: root
  become: true
  when: "'systemd-resolved' in ansible_facts.packages"
  notify: Restart systemd-resolved
  tags: ['containers-dns']

- name: 'containers: Configure podman for the service user'
  block:
    - name: 'containers: Create the user containers config directories'
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ xdg_config_home }}/containers"
        - "{{ xdg_config_home }}/containers/registries.conf.d"
        - "{{ xdg_config_home }}/containers/containers.conf.d"

    - name: 'containers: Enable unqualified image searches'
      ansible.builtin.copy:
        content: |
          unqualified-search-registries = [
            'docker.io',
            'registry.fedoraproject.org',
            'registry.access.redhat.com',
            'registry.centos.org'
          ]
        dest: "{{ xdg_config_home }}/containers/registries.conf"
        mode: "0644"

    - name: 'containers: Accept unsigned images'
      ansible.builtin.copy:
        content: |
          {"default": [{"type": "insecureAcceptAnything"}]}
        dest: "{{ xdg_config_home }}/containers/policy.json"
        mode: "0644"

    - name: 'containers: Select the overlay storage driver'
      ansible.builtin.copy:
        content: |
          [storage]
          driver = "overlay"
        dest: "{{ xdg_config_home }}/containers/storage.conf"
        mode: "0644"

    # Podman's own DNS would otherwise want 53, which pi-hole is holding.
    - name: "containers: Move podman's DNS off port 53"
      ansible.builtin.copy:
        content: |
          [network]
          dns_bind_port = 20053
        dest: "{{ xdg_config_home }}/containers/containers.conf.d/dns-bind-port-not-53.conf"
        mode: "0644"

    - name: 'containers: Raise container limits'
      ansible.builtin.copy:
        content: |
          [containers]
          pids_limit = 0
          default_ulimits = [
            "nofile=65536:65536"
          ]

          [network]
          network_backend = "netavark"
        dest: "{{ xdg_config_home }}/containers/containers.conf.d/performance-tuning.conf"
        mode: "0644"
  become: true
  become_user: "{{ ansible_user }}"
  environment: "{{ _user_env }}"
  tags: ['containers-config']
