---
# Trixie carries every one of these, including eza, which used to need a
# third-party repository. The names differ from Arch's in two places and
# fd-find's binary differs from its package name, which the symlink below fixes.

- name: 'shell: Install zsh and its completion data'
  ansible.builtin.apt:
    name:
      - zsh
      - zsh-common
      - bash-completion
    state: present
  become: true

- name: 'shell: Install shell sidecars'
  ansible.builtin.apt:
    name:
      - atuin
      - zoxide
      - fzf
      - grc
      - rename         # perl-rename on Arch
    state: present
  become: true

- name: 'shell: Install command-line tools'
  ansible.builtin.apt:
    name:
      - bat
      - fd-find        # fd on Arch
      - eza
      - ripgrep
      - duf
      - btop
      - ncdu
      - nnn
      - rsync
    state: present
  become: true

# Debian ships the binaries under different names to avoid collisions with
# older packages. User tools can use the upstream names on pak.
- name: 'shell: Give Debian-renamed binaries their upstream names'
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - { src: /usr/bin/fdfind, dest: /usr/local/bin/fd }
    - { src: /usr/bin/batcat, dest: /usr/local/bin/bat }
  become: true
