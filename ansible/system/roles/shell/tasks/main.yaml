---
# The one role every host runs. Three parts, separately taggable because they
# change and fail for different reasons: packages (distribution-specific),
# plugins (host-independent checkouts), and the rc.d fragments (pure config, and
# the part that actually changes week to week).

- name: 'shell: Install packages for Arch'
  ansible.builtin.include_tasks: packages-arch.yaml
  when: "'arch' in group_names"
  tags: ['shell-packages']

- name: 'shell: Install packages for Debian'
  ansible.builtin.include_tasks: packages-debian.yaml
  when: "'debian' in group_names"
  tags: ['shell-packages']

# Guix installs nothing here: it resolves plugins from the Home profile, built
# from the 11xx channel and declared in home-configuration.scm. It has no
# /usr/share to install into and no reason to grow one.
- name: 'shell: Install zsh plugins'
  ansible.builtin.include_tasks: plugins.yaml
  when: "'guix' not in group_names"
  tags: ['shell-plugins']

- name: 'shell: Deploy shared rc.d fragments'
  ansible.builtin.include_tasks: rc.yaml
  tags: ['shell-rc']
