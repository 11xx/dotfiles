---
# Install shell packages and the plugin checkouts used by ak. Gak and pak own
# their interactive configuration separately.

- name: 'shell: Install packages for Arch'
  ansible.builtin.include_tasks: packages-arch.yaml
  when: "'arch' in group_names"
  tags: ['shell-packages']

- name: 'shell: Install packages for Debian'
  ansible.builtin.include_tasks: packages-debian.yaml
  when: "'debian' in group_names"
  tags: ['shell-packages']

# ak loads these checkouts from its own rc.d configuration. Guix and Debian
# headless shells use zsh, atuin, and zoxide without additional plugins.
- name: 'shell: Install ak zsh plugins'
  ansible.builtin.include_tasks: plugins.yaml
  when: "'arch' in group_names"
  tags: ['shell-plugins']

- name: 'shell: Deploy ak rc.d fragments'
  ansible.builtin.include_tasks: rc.yaml
  when: "'arch' in group_names"
  tags: ['shell-rc']

- name: 'shell: Set the login shell'
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: "{{ zsh_login_shell }}"
  become: true
  when: zsh_login_shell is defined
  tags: ['shell-packages']
