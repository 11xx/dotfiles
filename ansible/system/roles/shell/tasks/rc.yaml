---
# The shared layer itself: a directory of numbered fragments that every host
# sources in filename order. Fragments are shared verbatim; anything that only
# makes sense on one host stays in that host's own config, which is sourced
# after rc.d and so can override anything here.
#
# Nothing in this file escalates. Every path is under the target user's home,
# which is what lets gak participate without a become password.

- name: 'shell: Create ZDOTDIR and its fragment directory'
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ zdotdir }}"
    - "{{ zsh_rc_dir }}"

- name: 'shell: Deploy static rc.d fragments'
  ansible.builtin.copy:
    src: rc.d/
    dest: "{{ zsh_rc_dir }}/"
    mode: "0644"

- name: 'shell: Deploy generated rc.d fragments'
  ansible.builtin.template:
    src: "rc.d/{{ item }}.j2"
    dest: "{{ zsh_rc_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - 40-plugins.zsh
    - 60-sidecars.zsh

# Fragments are sourced by glob, so one left behind by a rename keeps running
# forever and is genuinely hard to notice. Enumerate what belongs and delete the
# rest, which makes the directory Ansible's rather than a shared dumping ground.
- name: 'shell: List fragments currently on the host'
  ansible.builtin.find:
    paths: "{{ zsh_rc_dir }}"
    patterns: '*.zsh'
    file_type: file
  register: zsh_rc_present
  changed_when: false

- name: 'shell: Remove fragments no longer part of the shared set'
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ zsh_rc_present.files | map(attribute='path') | list
       | difference(zsh_rc_managed | map('regex_replace', '^', zsh_rc_dir ~ '/') | list) }}
  vars:
    zsh_rc_managed: >-
      {{ (query('fileglob', role_path ~ '/files/rc.d/*.zsh') | map('basename') | list)
         + ['40-plugins.zsh', '60-sidecars.zsh'] }}

# ak's .zshrc is tangled from ~/.config/shell/README.org and gak's is generated
# by Guix Home, so both source rc.d on their own terms. Only pak has no shell
# config of its own for Ansible to defer to.
- name: 'shell: Deploy zshenv and zshrc'
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: zshenv.j2, dest: "{{ ansible_facts['user_dir'] }}/.zshenv" }
    - { src: zshrc.j2, dest: "{{ zdotdir }}/.zshrc" }
  loop_control:
    label: "{{ item.dest }}"
  when: zsh_manage_zshrc | default(false)

- name: 'shell: Set the login shell to zsh'
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: "{{ zsh_login_shell | default('/bin/zsh') }}"
  become: true
  when: zsh_manage_zshrc | default(false)
