---
- name: 'gak_compose: Create the shared services directory'
  ansible.builtin.file:
    path: '{{ gak_compose_services_root }}'
    state: directory
    mode: '0755'
  tags: ['gak-compose-config']

- name: 'gak_compose: Create the operator command directory'
  ansible.builtin.file:
    path: '{{ gak_services_bin_dir }}'
    state: directory
    mode: '0755'
  tags: ['gak-compose-config']

- name: 'gak_compose: Deploy the declared application list'
  ansible.builtin.copy:
    content: "{{ (gak_applications | join(_gak_compose_newline)) ~ (_gak_compose_newline if gak_applications | length > 0 else '') }}"
    dest: '{{ gak_compose_declared_file }}'
    mode: '0644'
  vars:
    _gak_compose_newline: "\n"
  tags: ['gak-compose-config']

- name: 'gak_compose: Deploy the enabled application list'
  ansible.builtin.copy:
    content: "{{ (gak_compose_autostart | join(_gak_compose_newline)) ~ (_gak_compose_newline if gak_compose_autostart | length > 0 else '') }}"
    dest: '{{ gak_compose_autostart_file }}'
    mode: '0644'
  vars:
    _gak_compose_newline: "\n"
  tags: ['gak-compose-config']

- name: 'gak_compose: Deploy instance project and network policy'
  ansible.builtin.copy:
    content: "{{ (item.entries | join(_gak_compose_newline)) ~ (_gak_compose_newline if item.entries | length > 0 else '') }}"
    dest: '{{ item.path }}'
    mode: '0644'
  loop:
    - path: '{{ gak_compose_supported_file }}'
      entries: '{{ gak_compose_supported }}'
    - path: '{{ gak_compose_never_autostart_file }}'
      entries: '{{ gak_compose_never_autostart }}'
    - path: '{{ gak_compose_networks_file }}'
      entries: '{{ gak_compose_external_networks }}'
  vars:
    _gak_compose_newline: "\n"
  tags: ['gak-compose-config']

- name: 'gak_compose: Deploy the lifecycle helper'
  ansible.builtin.copy:
    src: gak-compose-lifecycle
    dest: '{{ gak_services_bin_dir }}/gak-compose-lifecycle'
    mode: '0755'
  tags: ['gak-compose-config']

- name: 'gak_compose: Create the Home package source directory'
  ansible.builtin.file:
    path: '{{ guix_home_config_dir }}/packages'
    state: directory
    mode: '0755'
  tags: ['gak-compose-config', 'guix-home']

- name: 'gak_compose: Deploy the updater package sources'
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '{{ guix_home_config_dir }}/packages/{{ item }}'
    mode: '0644'
  loop:
  - gak-services.scm
  - gak-services.py
  tags: ['gak-compose-config', 'guix-home']
