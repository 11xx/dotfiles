---
- name: 'gak_compose: Create the shared services directory'
  ansible.builtin.file:
    path: '{{ gak_compose_services_root }}'
    state: directory
    mode: '0755'
  tags: ['gak-compose-config']

- name: 'gak_compose: Create the operator command directory'
  ansible.builtin.file:
    path: '{{ gak_services_bin_dir }}'
    state: directory
    mode: '0755'
  tags: ['gak-compose-config']

- name: 'gak_compose: Deploy the declared application list'
  ansible.builtin.copy:
    content: "{{ (gak_applications | join(_gak_compose_newline)) ~ (_gak_compose_newline if gak_applications | length > 0 else '') }}"
    dest: '{{ gak_compose_declared_file }}'
    mode: '0644'
  vars:
    _gak_compose_newline: "\n"
  tags: ['gak-compose-config']

- name: 'gak_compose: Deploy the enabled application list'
  ansible.builtin.copy:
    content: "{{ (gak_compose_autostart | join(_gak_compose_newline)) ~ (_gak_compose_newline if gak_compose_autostart | length > 0 else '') }}"
    dest: '{{ gak_compose_autostart_file }}'
    mode: '0644'
  vars:
    _gak_compose_newline: "\n"
  tags: ['gak-compose-config']

- name: 'gak_compose: Deploy the lifecycle helper'
  ansible.builtin.copy:
    src: gak-compose-lifecycle
    dest: '{{ gak_services_bin_dir }}/gak-compose-lifecycle'
    mode: '0755'
  tags: ['gak-compose-config']

# The launcher is what an operator runs; the implementation is what the
# launcher hands to the interpreter its Guix profile declares.
- name: 'gak_compose: Deploy the update command'
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ gak_services_bin_dir }}/{{ item.dest }}'
    mode: '{{ item.mode }}'
  loop:
  - src: gak-services
    dest: gak-services
    mode: '0755'
  - src: gak-services.py
    dest: gak-services.py
    mode: '0644'
  loop_control:
    label: '{{ item.dest }}'
  tags: ['gak-compose-config']
