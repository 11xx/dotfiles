---
- name: Ensure acl package is present
  tags: [aiagent_host]
  community.general.pacman:
    name: acl
    state: present
  become: true

- name: Ensure shared workspace group exists
  tags: [aiagent_host]
  ansible.builtin.group:
    name: "{{ aiagent_shared_group }}"
    state: present
  become: true

- name: Create AI agent service user
  tags: [aiagent_host]
  ansible.builtin.user:
    name: "{{ aiagent_name }}"
    shell: "{{ aiagent_shell }}"
    create_home: true
    state: present
  register: aiagent_user
  become: true

- name: Add host user to shared group
  tags: [aiagent_host]
  ansible.builtin.user:
    name: "{{ aiagent_host_user }}"
    groups: "{{ aiagent_shared_group }}"
    append: true
  become: true

- name: Add AI agent user to shared group
  tags: [aiagent_host]
  ansible.builtin.user:
    name: "{{ aiagent_name }}"
    groups: "{{ aiagent_shared_group }}"
    append: true
  become: true

# Ensure aiagent_user.uid is always defined for selective tag runs
# (getent provides passwd info even if the user-creation step is skipped).
- name: Gather AI agent user info (always)
  tags: [aiagent_user, aiagent_host]
  ansible.builtin.getent:
    database: passwd
    key: "{{ aiagent_name }}"
  register: aiagent_getent

- name: Set aiagent_user.uid fact
  tags: [aiagent_host, aiagent_user]
  ansible.builtin.set_fact:
    aiagent_user:
      uid: "{{ aiagent_getent.ansible_facts.getent_passwd[aiagent_name][1] }}"
  when:
    - aiagent_getent.ansible_facts.getent_passwd is defined
    - aiagent_name in aiagent_getent.ansible_facts.getent_passwd

# --- subuid/subgid ---
# grep rc=0: match found, rc=1: no match, rc=2: file error/absent
# rc != 0 in both "no mapping" cases → proceed with allocation

- name: Check existing subuid mapping
  tags: [aiagent_host]
  ansible.builtin.command:
    cmd: "grep -c ^{{ aiagent_name }}: /etc/subuid"
  register: subuid_check
  changed_when: false
  failed_when: subuid_check.rc > 1
  become: true

- name: Compute next free subuid block
  tags: [aiagent_host]
  ansible.builtin.shell:
    cmd: >
      [ -s /etc/subuid ]
      && awk -F: '{print $2+$3}' /etc/subuid | sort -n | tail -1
      || echo 100000
    executable: /bin/bash
  register: next_subuid
  changed_when: false
  when: subuid_check.rc != 0
  become: true

- name: Assign subuid range to AI agent user
  tags: [aiagent_host]
  ansible.builtin.command:
    cmd: >
      usermod --add-subuids
      {{ next_subuid.stdout | int }}-{{ next_subuid.stdout | int + aiagent_subuid_count - 1 }}
      {{ aiagent_name }}
  when: subuid_check.rc != 0
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Check existing subgid mapping
  tags: [aiagent_host]
  ansible.builtin.command:
    cmd: "grep -c ^{{ aiagent_name }}: /etc/subgid"
  register: subgid_check
  changed_when: false
  failed_when: subgid_check.rc > 1
  become: true

- name: Compute next free subgid block
  tags: [aiagent_host]
  ansible.builtin.shell:
    cmd: >
      [ -s /etc/subgid ]
      && awk -F: '{print $2+$3}' /etc/subgid | sort -n | tail -1
      || echo 100000
    executable: /bin/bash
  register: next_subgid
  changed_when: false
  when: subgid_check.rc != 0
  become: true

- name: Assign subgid range to AI agent user
  tags: [aiagent_host]
  ansible.builtin.command:
    cmd: >
      usermod --add-subgids
      {{ next_subgid.stdout | int }}-{{ next_subgid.stdout | int + aiagent_subuid_count - 1 }}
      {{ aiagent_name }}
  when: subgid_check.rc != 0
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

# --- directories ---

- name: Create AI agent application directories
  tags: [aiagent_host]
  ansible.builtin.file:
    path: "{{ aiagent_container_root }}/{{ item }}"
    state: directory
    owner: "{{ aiagent_name }}"
    group: "{{ aiagent_name }}"
    mode: "0750"
  loop: "{{ aiagent_container_dirs }}"
  become: true

- name: Create shared workspace root
  tags: [aiagent_host]
  ansible.builtin.file:
    path: "{{ aiagent_workspace_root }}"
    state: directory
    owner: root
    group: "{{ aiagent_shared_group }}"
    mode: "2770"
  become: true

# --- ACLs ---

- name: Apply named user access ACLs on shared workspace
  tags: [aiagent_host]
  ansible.posix.acl:
    path: "{{ aiagent_workspace_root }}"
    entity: "{{ item }}"
    etype: user
    permissions: rwX
    recursive: true
    state: present
  loop:
    - "{{ aiagent_host_user }}"
    - "{{ aiagent_name }}"
  become: true

- name: Apply named group access ACL on shared workspace
  tags: [aiagent_host]
  ansible.posix.acl:
    path: "{{ aiagent_workspace_root }}"
    entity: "{{ aiagent_shared_group }}"
    etype: group
    permissions: rwX
    recursive: true
    state: present
  become: true

- name: Apply default user ACLs on shared workspace
  tags: [aiagent_host]
  ansible.posix.acl:
    path: "{{ aiagent_workspace_root }}"
    entity: "{{ item }}"
    etype: user
    permissions: rwx
    default: true
    recursive: true
    state: present
  loop:
    - "{{ aiagent_host_user }}"
    - "{{ aiagent_name }}"
  become: true

- name: Apply default group ACL on shared workspace
  tags: [aiagent_host]
  ansible.posix.acl:
    path: "{{ aiagent_workspace_root }}"
    entity: "{{ aiagent_shared_group }}"
    etype: group
    permissions: rwx
    default: true
    recursive: true
    state: present
  become: true

- name: Fix legacy POSIX permissions on shared workspace
  tags: [aiagent_host]
  ansible.builtin.file:
    path: "{{ aiagent_workspace_root }}"
    state: directory
    recurse: true
    # ug+rwX: Give user & group Read, Write, and Execute (if directory/script)
    # o-rwx:  Remove all permissions from others
    mode: "ug+rwX,o-rwx"
  become: true

# --- linger ---

- name: Enable lingering for AI agent user
  tags: [aiagent_host]
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ aiagent_name }}"
    creates: "/var/lib/systemd/linger/{{ aiagent_name }}"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Deploy aiagent files and quadlets
  tags: [aiagent_user]
  ansible.builtin.import_tasks: copy-files.yaml
  ignore_errors: "{{ ansible_check_mode }}"

- name: Configure passwordless sudo for aiagent management
  tags: [aiagent_host]
  ansible.builtin.import_tasks: sudoers.yaml
  ignore_errors: "{{ ansible_check_mode }}"
