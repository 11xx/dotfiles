---
# A full down/up of one small container. Unlike the starrs handler this does not
# check whether the stack is already running first: the unit is enabled, so on
# a healthy host it always is, and starting it is not a decision that needs a
# human the way putting a torrent client on the network is.
- name: Restart services
  ansible.builtin.systemd_service:
    name: services.service
    state: restarted
    daemon_reload: true
    scope: user
  when: not ansible_check_mode
