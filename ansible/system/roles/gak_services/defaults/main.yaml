---
# The general services stack lives under $HOME rather than on the media
# filesystem. Nothing in it touches the media tree, and its state is hundreds of
# megabytes rather than the gigabytes that put the media stack on the array.
#
# The containers themselves are not here. gak has no systemd, so they are
# declared in system.scm through Guix's OCI-to-Shepherd builder; the values they
# need are host facts in host_vars/gak/main, shared with that template. This
# role owns only what the containers read and write.
gak_services_dir: "{{ ansible_facts['user_dir'] }}/services"
gak_services_bin_dir: "{{ ansible_facts['user_dir'] }}/.local/bin"
