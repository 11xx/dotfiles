---
# gak's general services — everything that is not the media pipeline.
#
# The containers are declared in system.scm, because gak runs Shepherd and has
# no systemd. This role deploys what they read and write: the state directory
# and the one secret that must not go into the world-readable store.
#
# Nothing here escalates. The containers run rootless as the login user, under
# that user's home.

- name: 'gak_services: Create the stack directory tree'
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    # Koito's own state: the SQLite database, the image cache, the import
    # staging directory. Created here rather than left to podman, which would
    # make a missing bind mount report itself from inside the container, far
    # from the cause.
    - { path: "{{ gak_services_dir }}", mode: "0755" }
    - { path: "{{ gak_services_dir }}/koito", mode: "0755" }
    # 0700: the directory below holds the admin password.
    - { path: "{{ gak_services_dir }}/koito/secrets", mode: "0700" }
  loop_control:
    label: "{{ item.path }}"
  tags: ['gak-services-config', 'gak-services-secrets']

# Koito reads any setting from a file when given the `_FILE` suffix, which is
# what keeps this out of system.scm: that file is built into /gnu/store and is
# world-readable, so a password written there is published to every user on the
# machine.
#
# Read only while the database is empty, to create the first account. Changing
# it afterwards does nothing — change the password in the web UI, and update the
# vault to match so a rebuilt instance agrees with the one that exists.
- name: 'gak_services: Deploy the koito admin password'
  ansible.builtin.copy:
    content: "{{ koito_admin_password }}"
    dest: "{{ gak_services_dir }}/koito/secrets/default-password"
    mode: "0600"
  no_log: true
  tags: ['gak-services-config', 'gak-services-secrets']

# Starting and stopping is Shepherd's, and Shepherd's configuration is
# system.scm, which is applied by hand. Ansible has no lever here, so it says so
# rather than pretending otherwise.
- name: 'gak_services: Report how to drive the stack'
  ansible.builtin.debug:
    msg: >-
      Koito is a system Shepherd service declared in system.scm. It starts at
      boot once `sudo guix system reconfigure` has been run on gak. Check it
      with `sudo herd status koito`, and reach it on port {{ gak_koito_port }}.
  tags: ['gak-services-config']
