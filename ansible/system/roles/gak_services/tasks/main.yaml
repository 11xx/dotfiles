---
# gak's general services stack — everything that is not the media pipeline.
#
# Ansible owns the declarative half: the compose file, the environment file and
# the systemd user unit. It does not own what the containers write under the
# stack directory, because that is service state rewritten at runtime.
#
# Nothing here escalates. The stack runs rootless as the login user, under that
# user's home.

- name: 'gak_services: Create the stack directory tree'
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ gak_services_dir }}"
    # Created here rather than left to podman: a bind mount whose source is
    # missing is a class of failure that reports itself from inside the
    # container, far from the cause.
    - "{{ gak_services_dir }}/koito"
    - "{{ xdg_config_home }}/systemd/user"
  tags: ['gak-services-config', 'gak-services-unit']

- name: 'gak_services: Deploy the compose file'
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ gak_services_dir }}/compose.yaml"
    mode: "0644"
  notify: Restart services
  tags: ['gak-services-config']

# 0600: this seeds Koito's admin account, and the instance is reachable over
# the tailnet.
- name: 'gak_services: Deploy the koito environment file'
  ansible.builtin.template:
    # Named without the .env infix so the repository's "never commit a .env"
    # ignore rule keeps applying to real ones.
    src: koito-env.j2
    dest: "{{ gak_services_dir }}/koito.env"
    mode: "0600"
  notify: Restart services
  tags: ['gak-services-config', 'gak-services-secrets']

- name: 'gak_services: Install the stack systemd user unit'
  ansible.builtin.template:
    src: services.service.j2
    dest: "{{ xdg_config_home }}/systemd/user/services.service"
    mode: "0644"
  notify: Restart services
  tags: ['gak-services-unit']

# Enabled, unlike the starrs stack. Nothing here puts a torrent client on the
# network, and a scrobble receiver that is down when the phone flushes its queue
# is a receiver that loses listens.
- name: 'gak_services: Enable the stack at boot'
  ansible.builtin.systemd_service:
    name: services.service
    enabled: true
    daemon_reload: true
    scope: user
  when: not ansible_check_mode
  tags: ['gak-services-unit']
