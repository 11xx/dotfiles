---
# gak's general services — everything that is not the media pipeline. Guix owns
# the rootless containers and GNU Shepherd lifecycle; this role owns their
# state, secret files and operator commands.

- name: 'gak_services: Create the stack directory tree'
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ gak_services_dir }}", mode: "0755" }
    - { path: "{{ gak_services_bin_dir }}", mode: "0755" }
    - { path: "{{ gak_services_dir }}/koito", mode: "0755" }
    - { path: "{{ gak_services_dir }}/koito/secrets", mode: "0700" }
    - { path: "{{ gak_services_dir }}/nextcloud", mode: "0750" }
    - { path: "{{ gak_services_dir }}/nextcloud/html", mode: "0750" }
    - { path: "{{ gak_services_dir }}/nextcloud/postgres", mode: "0700" }
    - { path: "{{ gak_services_dir }}/nextcloud/secrets", mode: "0710" }
    - { path: "{{ gak_services_dir }}/nextcloud/backup-staging", mode: "0700" }
    - { path: "{{ gak_nextcloud_backup_dir }}", mode: "0700" }
    - { path: "{{ gak_nextcloud_backup_dir }}/restic", mode: "0700" }
  loop_control:
    label: "{{ item.path }}"
  tags: ['gak-services-config', 'gak-services-secrets']

# Koito reads any setting from a file when given the `_FILE` suffix, which is
# what keeps this out of system.scm: that file is built into /gnu/store and is
# world-readable, so a password written there is published to every user on the
# machine.
#
# Read only while the database is empty, to create the first account. Changing
# it afterwards does nothing — change the password in the web UI, and update the
# vault to match so a rebuilt instance agrees with the one that exists.
- name: 'gak_services: Deploy the koito admin password'
  ansible.builtin.copy:
    content: "{{ koito_admin_password }}"
    dest: "{{ gak_services_dir }}/koito/secrets/default-password"
    mode: "0600"
  no_log: true
  tags: ['gak-services-config', 'gak-services-secrets']

- name: 'gak_services: Deploy the nextcloud secret files'
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ gak_services_dir }}/nextcloud/secrets/{{ item.name }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: postgres-password, content: "{{ nextcloud_postgres_password }}", mode: "0600" }
    - { name: admin-password, content: "{{ nextcloud_admin_password }}", mode: "0600" }
    - { name: redis-password, content: "{{ nextcloud_redis_password }}", mode: "0640" }
    - { name: restic-password, content: "{{ nextcloud_restic_password }}", mode: "0600" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  tags: ['gak-services-config', 'gak-services-secrets']

- name: 'gak_services: Deploy the nextcloud daily-user password environment'
  ansible.builtin.copy:
    content: "OC_PASS={{ nextcloud_user_password }}\n"
    dest: "{{ gak_services_dir }}/nextcloud/secrets/daily-user.env"
    mode: "0600"
  no_log: true
  tags: ['gak-services-config', 'gak-services-secrets']

- name: 'gak_services: Deploy the private redis configuration'
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ gak_services_dir }}/nextcloud/secrets/redis.conf"
    mode: "0640"
  no_log: true
  tags: ['gak-services-config', 'gak-services-secrets']

# PostgreSQL and Redis drop privileges inside their containers. Translate their
# image UIDs through rootless podman's user namespace so the bind mounts remain
# private and writable without granting access to other host users.
- name: 'gak_services: Let nextcloud traverse its secret directory'
  ansible.builtin.command:
    argv:
      - podman
      - unshare
      - chown
      - '0:33'
      - "{{ gak_services_dir }}/nextcloud/secrets"
  changed_when: false
  when: not ansible_check_mode
  tags: ['gak-services-config', 'gak-services-secrets']

- name: 'gak_services: Let nextcloud read its redis password'
  ansible.builtin.command:
    argv:
      - podman
      - unshare
      - chown
      - '0:33'
      - "{{ gak_services_dir }}/nextcloud/secrets/redis-password"
  changed_when: false
  when: not ansible_check_mode
  tags: ['gak-services-config', 'gak-services-secrets']

- name: 'gak_services: Give postgres its state directory'
  ansible.builtin.command:
    argv:
      - podman
      - unshare
      - chown
      - '70:70'
      - "{{ gak_services_dir }}/nextcloud/postgres"
  changed_when: false
  when: not ansible_check_mode
  tags: ['gak-services-config']

- name: 'gak_services: Let redis read its private configuration'
  ansible.builtin.command:
    argv:
      - podman
      - unshare
      - chown
      - '0:1000'
      - "{{ gak_services_dir }}/nextcloud/secrets/redis.conf"
  changed_when: false
  when: not ansible_check_mode
  tags: ['gak-services-config', 'gak-services-secrets']

- name: 'gak_services: Deploy nextcloud operator commands'
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ gak_services_bin_dir }}/{{ item.dest }}"
    mode: "0755"
  loop:
    - { src: nextcloud-backup.j2, dest: gak-nextcloud-backup }
    - { src: nextcloud-restore-check.j2, dest: gak-nextcloud-restore-check }
    - { src: tailscale-services.j2, dest: gak-tailscale-services }
  loop_control:
    label: "{{ item.dest }}"
  tags: ['gak-services-config']

- name: 'gak_services: Check whether nextcloud is available for bootstrap'
  ansible.builtin.command:
    argv: [podman, container, exists, nextcloud]
  register: gak_nextcloud_container
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  tags: ['gak-services-bootstrap']

- name: 'gak_services: Read nextcloud application state'
  ansible.builtin.command:
    argv: [podman, exec, --user, '33', nextcloud, php, occ, app:list, --output=json]
  register: gak_nextcloud_apps
  changed_when: false
  when:
    - not ansible_check_mode
    - gak_nextcloud_container.rc == 0
  tags: ['gak-services-bootstrap']

- name: 'gak_services: Install the calendar application'
  ansible.builtin.command:
    argv: [podman, exec, --user, '33', nextcloud, php, occ, app:install, calendar]
  when:
    - not ansible_check_mode
    - gak_nextcloud_container.rc == 0
    - "'calendar' not in ((gak_nextcloud_apps.stdout | from_json).enabled | default({}))"
    - "'calendar' not in ((gak_nextcloud_apps.stdout | from_json).disabled | default({}))"
  tags: ['gak-services-bootstrap']

- name: 'gak_services: Enable the calendar application'
  ansible.builtin.command:
    argv: [podman, exec, --user, '33', nextcloud, php, occ, app:enable, calendar]
  register: gak_nextcloud_calendar
  changed_when: "'already enabled' not in gak_nextcloud_calendar.stdout"
  when:
    - not ansible_check_mode
    - gak_nextcloud_container.rc == 0
  tags: ['gak-services-bootstrap']

- name: 'gak_services: Check for the nextcloud daily account'
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - --user
      - '33'
      - nextcloud
      - php
      - occ
      - user:info
      - "{{ gak_nextcloud_user }}"
      - --output=json
  register: gak_nextcloud_user_info
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - gak_nextcloud_container.rc == 0
  tags: ['gak-services-bootstrap']

- name: 'gak_services: Create the nextcloud daily account'
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - --env-file
      - "{{ gak_services_dir }}/nextcloud/secrets/daily-user.env"
      - --user
      - '33'
      - nextcloud
      - php
      - occ
      - user:add
      - --password-from-env
      - --display-name
      - "{{ gak_nextcloud_user_display_name }}"
      - "{{ gak_nextcloud_user }}"
  no_log: true
  when:
    - not ansible_check_mode
    - gak_nextcloud_container.rc == 0
    - gak_nextcloud_user_info.rc != 0
  tags: ['gak-services-bootstrap']

- name: 'gak_services: Select cron for nextcloud background work'
  ansible.builtin.command:
    argv: [podman, exec, --user, '33', nextcloud, php, occ, background:cron]
  register: gak_nextcloud_background
  changed_when: "'cron' not in gak_nextcloud_background.stdout | lower"
  when:
    - not ansible_check_mode
    - gak_nextcloud_container.rc == 0
  tags: ['gak-services-bootstrap']

- name: 'gak_services: Set nextcloud phone-region defaults'
  ansible.builtin.command:
    argv: [podman, exec, --user, '33', nextcloud, php, occ, config:system:set, default_phone_region, --value=BR]
  changed_when: false
  when:
    - not ansible_check_mode
    - gak_nextcloud_container.rc == 0
  tags: ['gak-services-bootstrap']

- name: 'gak_services: Set nextcloud maintenance window'
  ansible.builtin.command:
    argv: [podman, exec, --user, '33', nextcloud, php, occ, config:system:set, maintenance_window_start, --type=integer, --value=5]
  changed_when: false
  when:
    - not ansible_check_mode
    - gak_nextcloud_container.rc == 0
  tags: ['gak-services-bootstrap']

# Starting and stopping is Shepherd's, and Shepherd's configuration is
# system.scm, which is applied by hand. Ansible has no lever here, so it says so
# rather than pretending otherwise.
- name: 'gak_services: Report how to drive the stack'
  ansible.builtin.debug:
    msg: >-
      Koito and Nextcloud are system Shepherd services declared in system.scm.
      After reconfiguration, inspect `sudo herd status koito nextcloud
      nextcloud-db nextcloud-redis nextcloud-cron`. Run this role again with
      `--tags gak-services-bootstrap` to create the daily account and Calendar.
  tags: ['gak-services-config']
