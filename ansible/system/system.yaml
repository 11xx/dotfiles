---
# ak — the Arch desktop, managed locally by the playbook running on it.
#
# Tags come in two levels. Every role answers to its own name, so the habitual
# `--tags firewall` keeps working; roles that do several separable things also
# tag those individually (`shell-plugins`, `containers-config`, and so on).
# `ansible-playbook system.yaml --list-tags` prints the current set.

- name: Arch desktop
  hosts: ak

  roles:
    # Base system
    - { role: system_files, tags: ['system_files'] }
    - { role: file_system, tags: ['file_system'] }
    - { role: firewall, tags: ['firewall'] }
    - { role: services, tags: ['services'] }
    - { role: guix_offload, tags: ['guix-offload'] }
    - { role: aur, tags: ['aur'] }

    # Shell — the one role shared with gak and pak.
    - { role: shell, tags: ['shell'] }

    # Desktop session
    - { role: fonts, tags: ['fonts'] }
    - { role: hyprland, tags: ['hyprland'] }
    - { role: desktop, tags: ['desktop'] }
    - { role: kde-not-in-kde, tags: ['kde-not-in-kde'] }
    - { role: browser, tags: ['browser'] }
    - { role: emacs, tags: ['emacs'] }
    - { role: mpd, tags: ['mpd'] }

    # Everything else
    - { role: android, tags: ['android'] }
    - { role: script-deps, tags: ['script-deps'] }
    - { role: vpn, tags: ['vpn'] }
    - { role: containers, tags: ['containers'] }
    - { role: aiagent_host_setup, tags: ['aiagent'] }
    - { role: qemu-kvm, tags: ['qemu-kvm'] }
    - { role: controller-vm, tags: ['controller-vm'] }
    - { role: misc_packages, tags: ['misc_packages'] }

  tasks:
    # Previously untagged, so it ran on every `--tags anything` invocation, and
    # unprivileged, so it could not have installed anything if it had tried.
    - name: 'system: Install pacman maintenance tools'
      community.general.pacman:
        name:
          - pacman-contrib   # paccache, pactree, checkupdates
        state: present
      become: true
      tags: ['system_files', 'pacman']
