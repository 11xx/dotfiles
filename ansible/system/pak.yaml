---
# pak — the Raspberry Pi 4 on Debian, running the LAN's DNS, TLS front door and
# password vault as rootless containers.

- name: Raspberry Pi LAN services
  hosts: pak

  vars:
    # Rootless podman and the user systemd instance both need these, and neither
    # inherits them across a `become_user` hop — a become session gets a fresh,
    # near-empty environment, so a bare `systemctl --user` cannot find the bus.
    _user_env:
      XDG_RUNTIME_DIR: "{{ xdg_runtime_dir }}"
      XDG_CONFIG_HOME: "{{ xdg_config_home }}"
      XDG_DATA_HOME: "{{ xdg_data_home }}"
      HOME: "{{ ansible_facts['user_dir'] }}"

  pre_tasks:
    - name: 'pak: Refresh the apt cache'
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      become: true
      tags: ['always']

    # become to an unprivileged user needs ACL support to hand the temp file
    # over, and fails with a confusing permissions error without it.
    - name: 'pak: Install the become dependency'
      ansible.builtin.apt:
        name: acl
        state: present
      become: true
      tags: ['always']

  roles:
    - { role: firewall, tags: ['firewall'] }
    - { role: containers_pak, tags: ['containers'] }
    - { role: shell, tags: ['shell'] }
    - { role: pak_services, tags: ['pak-services'] }
