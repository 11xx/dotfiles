---
# gak — the Guix System home server: NFS for the media trees, rootless podman,
# and an offload build machine for ak.
#
# Guix is declarative and this playbook normally only ships files. System
# activation is available through the explicit `gak_activate_system` setting
# and `guix-activate` tag; it is disabled by default.
#
# Normal application deployment is unprivileged. The optional system
# activation task is the only privileged path. The play does have a vault: the
# media stack's Sonarr API key is in it.

- name: Controller operator command
  hosts: localhost
  connection: local
  gather_facts: true

  roles:
    - role: ai_agent.remote.operator
      vars:
        ai_agent_remote_operator_install_dir: "{{ ansible_facts['user_dir'] }}/.local/bin"
      tags: ['gak-aiagent', 'gak-aiagent-operator']

# Guix System ships no Python, and Ansible needs one on the target before it can
# run a single module. Without this play, reaching a rebuilt gak means logging in
# and installing it by hand first.
#
# `raw` is the one action that needs no interpreter: it is a bare command down
# the SSH connection. Facts are off because gathering them is itself a module.
- name: Guix home server — interpreter bootstrap
  hosts: gak
  gather_facts: false

  tasks:
    - name: 'bootstrap: Look for the Python interpreter'
      ansible.builtin.raw: "test -x {{ ansible_python_interpreter }}"
      register: gak_python
      changed_when: false
      failed_when: false
      tags: ['always']

    # Into the user profile rather than the Home profile: `guix home
    # reconfigure` is a manual step by design, and the interpreter has to exist
    # before Ansible can do anything at all, so it cannot wait on one. Being a
    # profile entry, it is also rooted against `guix gc`.
    - name: 'bootstrap: Install Python through guix'
      ansible.builtin.raw: "guix install python"
      # `raw` does not run under --check, so the probe above registers no exit
      # status there. Treating that as "present" keeps a dry run dry; a real run
      # always has the status and decides on it.
      when: gak_python.rc | default(0) != 0
      tags: ['always']

- name: Guix home server
  hosts: gak

  pre_tasks:
    - name: Validate the explicit application list
      ansible.builtin.assert:
        that:
          - gak_applications | type_debug == 'list'
          - gak_applications | unique | length == gak_applications | length
          - gak_applications | difference(['sabnzbd', 'prowlarr', 'sonarr', 'radarr', 'jellyfin', 'qbittorrent', 'recyclarr', 'koito', 'nextcloud']) | length == 0
        fail_msg: gak_applications must contain unique supported application names.
      tags: ['always']

    - name: Validate the explicit Compose autostart list
      ansible.builtin.assert:
        that:
          - gak_compose_autostart | type_debug == 'list'
          - gak_compose_autostart | unique | length == gak_compose_autostart | length
          - gak_compose_autostart | difference(gak_applications) | length == 0
          - "'recyclarr' not in gak_compose_autostart"
        fail_msg: >-
          gak_compose_autostart must contain unique declared applications and
          must not select recyclarr.
      tags: ['always']

  roles:
    - role: ai_agent.remote.guix
      vars:
        ai_agent_remote_guix_module_dir: "{{ guix_config_dir }}/modules/aiagent"
      when: gak_aiagent_host_enabled | bool
      tags: ['guix', 'guix-system']
    - role: ai_agent.remote.gitolite
      vars:
        ai_agent_remote_gitolite_module_dir: "{{ guix_config_dir }}/modules/aiagent"
      when: gak_git_hub_enabled | bool
      tags: ['guix', 'guix-system']
    - { role: guix_config, tags: ['guix'] }
    - { role: shell, tags: ['shell'] }
    - { role: gak_media, tags: ['gak-media'] }
    - { role: gak_sabnzbd, tags: ['gak-media', 'gak-sabnzbd'], when: "'sabnzbd' in gak_applications" }
    - { role: gak_prowlarr, tags: ['gak-media', 'gak-prowlarr'], when: "'prowlarr' in gak_applications" }
    - { role: gak_sonarr, tags: ['gak-media', 'gak-sonarr'], when: "'sonarr' in gak_applications" }
    - { role: gak_radarr, tags: ['gak-media', 'gak-radarr'], when: "'radarr' in gak_applications" }
    - { role: gak_jellyfin, tags: ['gak-media', 'gak-jellyfin'], when: "'jellyfin' in gak_applications" }
    - { role: gak_qbittorrent, tags: ['gak-media', 'gak-qbittorrent'], when: "'qbittorrent' in gak_applications" }
    - { role: gak_recyclarr, tags: ['gak-media', 'gak-recyclarr'], when: "'recyclarr' in gak_applications" }
    - { role: gak_koito, tags: ['gak-services', 'gak-koito'], when: "'koito' in gak_applications" }
    - { role: gak_nextcloud, tags: ['gak-services', 'gak-nextcloud'], when: "'nextcloud' in gak_applications" }
    - role: ai_agent.remote.compose_runtime
      vars:
        ai_agent_remote_compose_home: "{{ ansible_facts['user_dir'] }}"
        ai_agent_remote_compose_services_root: "{{ ansible_facts['user_dir'] }}/services"
        ai_agent_remote_compose_operator_bin_dir: "{{ gak_services_bin_dir }}"
        ai_agent_remote_compose_package_source_dir: "{{ guix_home_config_dir }}/packages"
        ai_agent_remote_compose_application_names: "{{ gak_applications }}"
        ai_agent_remote_compose_autostart_names: "{{ gak_compose_autostart }}"
        ai_agent_remote_compose_supported_names: "{{ gak_compose_supported }}"
        ai_agent_remote_compose_never_autostart_names: "{{ gak_compose_never_autostart }}"
        ai_agent_remote_compose_external_network_names: "{{ gak_compose_external_networks }}"
      tags: ['gak-services', 'gak-compose']
    - { role: gak_ingress, tags: ['gak-services', 'gak-ingress'] }

  post_tasks:
    - name: 'guix: Activate the system configuration when explicitly requested'
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - umask 022 && exec guix system reconfigure -L {{ guix_config_dir }}/modules {{ guix_config_dir }}/system.scm
      become: true
      when:
        - gak_activate_system | bool
        - not ansible_check_mode
      tags: ['guix-activate']

    - name: 'guix: Report the skipped activation in check mode'
      ansible.builtin.debug:
        msg: >-
          Check mode skipped privileged activation. Apply with
          `--tags guix,gak-media,gak-services,gak-compose,guix-activate
          -e gak_activate_system=true` after review.
      when:
        - gak_activate_system | bool
        - ansible_check_mode
      tags: ['guix-activate']

- name: Agent host workload
  hosts: gak-aiagent
  gather_facts: false

  pre_tasks:
    - name: 'aiagent: Check temporary directories for Guix bootstrap'
      ansible.builtin.raw: >-
        test -d /home/aiagent/tmp &&
        test -d /home/aiagent/image-copy-tmp
      register: gak_aiagent_bootstrap_dirs
      failed_when: false
      changed_when: false
      tags: ['gak-aiagent']

    - name: 'aiagent: Create temporary directories for Guix bootstrap'
      ansible.builtin.raw: >-
        mkdir -p /home/aiagent/tmp /home/aiagent/image-copy-tmp &&
        chmod 0700 /home/aiagent/tmp /home/aiagent/image-copy-tmp
      when:
        - not ansible_check_mode
        - gak_aiagent_bootstrap_dirs.rc | default(0) != 0
      tags: ['gak-aiagent']

    - name: 'aiagent: Check the private profile tools'
      ansible.builtin.raw: >-
        test -x /home/aiagent/.guix-profile/bin/python3 &&
        test -x /home/aiagent/.guix-profile/bin/podman-compose
      register: gak_aiagent_profile_tools
      failed_when: false
      changed_when: false
      tags: ['gak-aiagent']

    - name: 'aiagent: Install the interpreter and Compose provider'
      ansible.builtin.raw: /run/current-system/profile/bin/guix install python podman-compose
      when:
        - not ansible_check_mode
        - gak_aiagent_profile_tools.rc | default(0) != 0
      tags: ['gak-aiagent']

  roles:
    - role: ai_agent.remote.agent
      vars:
        ai_agent_remote_agent_home: /home/aiagent
        ai_agent_remote_agent_t3_port: "{{ gak_t3_port }}"
      tags: ['gak-aiagent']
