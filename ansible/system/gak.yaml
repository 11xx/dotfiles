---
# gak — the Guix System home server: NFS for the media trees, rootless podman,
# and an offload build machine for ak.
#
# Guix is declarative and applies its own configuration, so this playbook ships
# files and stops there. It never runs `guix system reconfigure` or `guix home
# reconfigure`; the role prints whichever of those the change now needs.
#
# Nothing here escalates. Every path is either under the user's home or on the
# media filesystem, which that user owns, so gak needs no become password. It
# does have a vault: the media stack's Sonarr API key is in it.

# Guix System ships no Python, and Ansible needs one on the target before it can
# run a single module. Without this play, reaching a rebuilt gak means logging in
# and installing it by hand first.
#
# `raw` is the one action that needs no interpreter: it is a bare command down
# the SSH connection. Facts are off because gathering them is itself a module.
- name: Guix home server — interpreter bootstrap
  hosts: gak
  gather_facts: false

  tasks:
    - name: 'bootstrap: Look for the Python interpreter'
      ansible.builtin.raw: "test -x {{ ansible_python_interpreter }}"
      register: gak_python
      changed_when: false
      failed_when: false
      tags: ['always']

    # Into the user profile rather than the Home profile: `guix home
    # reconfigure` is a manual step by design, and the interpreter has to exist
    # before Ansible can do anything at all, so it cannot wait on one. Being a
    # profile entry, it is also rooted against `guix gc`.
    - name: 'bootstrap: Install Python through guix'
      ansible.builtin.raw: "guix install python"
      # `raw` does not run under --check, so the probe above registers no exit
      # status there. Treating that as "present" keeps a dry run dry; a real run
      # always has the status and decides on it.
      when: gak_python.rc | default(0) != 0
      tags: ['always']

- name: Guix home server
  hosts: gak

  pre_tasks:
    - name: Validate the explicit application list
      ansible.builtin.assert:
        that:
          - gak_applications | type_debug == 'list'
          - gak_applications | unique | length == gak_applications | length
          - gak_applications | difference(['sabnzbd', 'prowlarr', 'sonarr', 'radarr', 'jellyfin', 'qbittorrent', 'recyclarr', 'koito', 'nextcloud']) | length == 0
        fail_msg: gak_applications must contain unique supported application names.
      tags: ['always']

  roles:
    - { role: guix_config, tags: ['guix'] }
    - { role: shell, tags: ['shell'] }
    - { role: gak_media, tags: ['gak-media'] }
    - { role: gak_sabnzbd, tags: ['gak-media', 'gak-sabnzbd'], when: "'sabnzbd' in gak_applications" }
    - { role: gak_prowlarr, tags: ['gak-media', 'gak-prowlarr'], when: "'prowlarr' in gak_applications" }
    - { role: gak_sonarr, tags: ['gak-media', 'gak-sonarr'], when: "'sonarr' in gak_applications" }
    - { role: gak_radarr, tags: ['gak-media', 'gak-radarr'], when: "'radarr' in gak_applications" }
    - { role: gak_jellyfin, tags: ['gak-media', 'gak-jellyfin'], when: "'jellyfin' in gak_applications" }
    - { role: gak_qbittorrent, tags: ['gak-media', 'gak-qbittorrent'], when: "'qbittorrent' in gak_applications" }
    - { role: gak_recyclarr, tags: ['gak-media', 'gak-recyclarr'], when: "'recyclarr' in gak_applications" }
    - { role: gak_koito, tags: ['gak-services', 'gak-koito'], when: "'koito' in gak_applications" }
    - { role: gak_nextcloud, tags: ['gak-services', 'gak-nextcloud'], when: "'nextcloud' in gak_applications" }
    - { role: gak_ingress, tags: ['gak-services', 'gak-ingress'] }
